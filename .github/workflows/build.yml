name: Container Build & SBOM

on:
  push:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/containers/Containerfile.web
          push: false
          tags: kubelab/web:latest

      - name: Build API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/containers/Containerfile.api
          push: false
          tags: kubelab/api:latest
