name: Chaos & Resilience Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Chaos Simulation Scenarios
        run: cargo test -p kubelab-lab-orchestrator --test chaos_recovery_test
