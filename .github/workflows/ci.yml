name: CI & Zero-Trust Production Certification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-and-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kubelab
          POSTGRES_USER: kubelab
          POSTGRES_PASSWORD: kubelab_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/varz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Formatting Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy Linting
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core Test Suite (20 Unit & Contract Tests)
        run: cargo test --workspace --all-targets -- --nocapture

      - name: Run Live Backing Services Integration Tests (PostgreSQL, Redis, NATS)
        env:
          DATABASE_URL: postgres://kubelab:kubelab_secret_password@127.0.0.1:5432/kubelab
          REDIS_URL: redis://127.0.0.1:6379
          NATS_URL: nats://127.0.0.1:4222
        run: cargo test --workspace -- --ignored --nocapture

      - name: Validate Declarative Lab Catalog (145 Labs)
        run: cargo run -p kubelab-validation-engine --bin validate_lab_schema -- --path labs/

      - name: Execute 13-Gate Production Certification Script
        run: chmod +x ./scripts/validate-production.sh && ./scripts/validate-production.sh

  web-and-container-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Web Application Typecheck & Lint
        run: |
          pnpm --filter @kubelab/web typecheck
          pnpm --filter @kubelab/web lint

      - name: Install Playwright Browsers
        run: pnpm --filter @kubelab/web exec playwright install --with-deps chromium

      - name: Build Web Application
        run: pnpm --filter @kubelab/web build

      - name: Execute Playwright E2E Suite
        run: pnpm --filter @kubelab/web exec playwright test
        env:
          CI: true

      - name: Validate Containerfiles & OCI Definitions
        run: |
          test -f infrastructure/containers/Containerfile.api
          test -f infrastructure/containers/Containerfile.web
          test -f infrastructure/containers/Containerfile.toolchain
          test -f infrastructure/containers/podman-compose.yml
          test -f infrastructure/containers/podman-compose.test.yml
          test -f infrastructure/containers/otel-collector-config.yaml

  mobile-flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter Static Analysis (Zero Warnings/Errors)
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Widget & Navigation Tests
        working-directory: apps/mobile
        run: flutter test
