name: Labs & Sandbox Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Declarative Labs Schemas & Scenarios
        run: cargo test -p kubelab-validation-engine --test '*'
