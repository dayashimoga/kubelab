name: Security Audits & Supply Chain Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

permissions:
  contents: read

jobs:
  security-and-license-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo Vulnerability Audit
        run: cargo audit --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 || true

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: pnpm Security Audit
        run: pnpm audit --prod || true
