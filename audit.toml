# KubeLab Security Audit Configuration
# Configures cargo-audit vulnerability scanning policies and documented upstream exemptions.

[advisories]
ignore = [
    "RUSTSEC-2020-0071", # chronoutil / time format string
    "RUSTSEC-2020-0159", # time crate potential segfault in old versions
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames (transitive via hyper 0.14 / kube 0.93)
    "RUSTSEC-2024-0437", # protobuf uncontrolled recursion (transitive via prometheus 0.13 metrics scraper)
    "RUSTSEC-2023-0071", # rsa Marvin attack timing sidechannel (transitive via jsonwebtoken 9.3; no upstream fix available)
    "RUSTSEC-2026-0099", # rustls-webpki wildcard name constraints (transitive via reqwest / kube-rs)
    "RUSTSEC-2026-0104", # rustls-webpki CRL parsing panic (transitive via reqwest / kube-rs)
    "RUSTSEC-2026-0098", # rustls-webpki URI name constraints (transitive via reqwest / kube-rs)
    "RUSTSEC-2026-0049", # rustls-webpki CRL Distribution Point (transitive via reqwest / kube-rs)
    "RUSTSEC-2024-0363", # sqlx truncating/overflowing casts (mitigated by parameter binding)
    "RUSTSEC-2025-0012", # backoff unmaintained warning
    "RUSTSEC-2024-0388", # derivative unmaintained warning
    "RUSTSEC-2024-0384", # instant unmaintained warning
    "RUSTSEC-2024-0436", # paste unmaintained warning
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained warning
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained warning
]
