apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelab-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubelab-project
  source:
    repoURL: https://github.com/dayashimoga/kubelab.git
    targetRevision: main
    path: infrastructure/gitops/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
