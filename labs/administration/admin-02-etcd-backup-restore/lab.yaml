id: admin-02-etcd-backup-restore
title: etcd Snapshot Backup and Restore
difficulty: intermediate
duration_minutes: 20
track: administration
objectives:
- Master etcd Snapshot Backup and Restore in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Take snapshot with etcdctl and verify integrity
tasks:
- id: task-verify-admin-02-etcd-backup-restore
  title: Verify etcd Snapshot Backup and Restore
  description: Verify metadata.name on pods 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: pods
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `pods` resource specifications.
  penalty_points: 10
solution: kubectl apply -f admin-02-etcd-backup-restore.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
