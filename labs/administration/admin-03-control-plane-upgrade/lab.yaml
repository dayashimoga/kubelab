id: admin-03-control-plane-upgrade
title: Control-Plane & Kubelet Rolling Upgrade
difficulty: intermediate
duration_minutes: 20
track: administration
objectives:
- Master Control-Plane & Kubelet Rolling Upgrade in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Upgrade kubeadm, kubelet, and drain nodes
tasks:
- id: task-verify-admin-03-control-plane-upgrade
  title: Verify Control-Plane & Kubelet Rolling Upgrade
  description: Verify metadata.name on nodes 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: nodes
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `nodes` resource specifications.
  penalty_points: 10
solution: kubectl apply -f admin-03-control-plane-upgrade.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
