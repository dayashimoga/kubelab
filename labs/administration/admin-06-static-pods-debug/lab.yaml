id: admin-06-static-pods-debug
title: Managing Static Pod Manifests
difficulty: intermediate
duration_minutes: 20
track: administration
objectives:
- Master Managing Static Pod Manifests in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Deploy control-plane components under /etc/kubernetes/manifests
tasks:
- id: task-verify-admin-06-static-pods-debug
  title: Verify Managing Static Pod Manifests
  description: Verify metadata.name on pods 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: pods
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `pods` resource specifications.
  penalty_points: 10
solution: kubectl apply -f admin-06-static-pods-debug.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
