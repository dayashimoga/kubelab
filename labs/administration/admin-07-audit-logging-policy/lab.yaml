id: admin-07-audit-logging-policy
title: Kubernetes API Server Audit Policy Logging
difficulty: advanced
duration_minutes: 15
track: administration
scenario: Configure structured security audit logging rules for sensitive API requests
  and authentication events.
objectives:
- Master Kubernetes API Server Audit Policy Logging architecture and declarative configurations
- Diagnose and remediate common production gotchas in admin-07-audit-logging-policy
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-admin-07-audit-logging-policy
      labels:
        kubelab.io/track: administration
        kubelab.io/lab: admin-07-audit-logging-policy
tasks:
- id: task-01-admin-07-audit-logging-policy
  title: Deploy & Configure Kubernetes API Server Audit Policy Logging
  description: Apply the declarative manifest for admin-07-audit-logging-policy and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-07-audit-logging-policy
    namespace: lab-admin-07-audit-logging-policy
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-admin-07-audit-logging-policy
  title: Verify Production Hardening & Labels for Kubernetes API Server Audit Policy
    Logging
  description: Verify metadata labels and security compliance in namespace lab-admin-07-audit-logging-policy.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-07-audit-logging-policy
    namespace: lab-admin-07-audit-logging-policy
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: admin-07-audit-logging-policy
hints:
- text: Inspect the live objects with `kubectl get all -n lab-admin-07-audit-logging-policy
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=admin-07-audit-logging-policy
    -n lab-admin-07-audit-logging-policy`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/administration/admin-07-audit-logging-policy/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
