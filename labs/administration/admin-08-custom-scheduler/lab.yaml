id: admin-08-custom-scheduler
title: Deploying & Using Custom Secondary Schedulers
difficulty: advanced
duration_minutes: 15
track: administration
scenario: Deploy custom scheduler algorithms and route specialized workloads via schedulerName.
objectives:
- Master Deploying & Using Custom Secondary Schedulers architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in admin-08-custom-scheduler
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-admin-08-custom-scheduler
      labels:
        kubelab.io/track: administration
        kubelab.io/lab: admin-08-custom-scheduler
tasks:
- id: task-01-admin-08-custom-scheduler
  title: Deploy & Configure Deploying & Using Custom Secondary Schedulers
  description: Apply the declarative manifest for admin-08-custom-scheduler and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-08-custom-scheduler
    namespace: lab-admin-08-custom-scheduler
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-admin-08-custom-scheduler
  title: Verify Production Hardening & Labels for Deploying & Using Custom Secondary
    Schedulers
  description: Verify metadata labels and security compliance in namespace lab-admin-08-custom-scheduler.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-08-custom-scheduler
    namespace: lab-admin-08-custom-scheduler
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: admin-08-custom-scheduler
hints:
- text: Inspect the live objects with `kubectl get all -n lab-admin-08-custom-scheduler
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=admin-08-custom-scheduler
    -n lab-admin-08-custom-scheduler`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/administration/admin-08-custom-scheduler/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
