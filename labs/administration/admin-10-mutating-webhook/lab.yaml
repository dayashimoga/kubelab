id: admin-10-mutating-webhook
title: Dynamic Admission Control & Mutating Webhooks
difficulty: advanced
duration_minutes: 15
track: administration
scenario: Implement admission webhooks to intercept, mutate, and validate Kubernetes
  API requests.
objectives:
- Master Dynamic Admission Control & Mutating Webhooks architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in admin-10-mutating-webhook
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-admin-10-mutating-webhook
      labels:
        kubelab.io/track: administration
        kubelab.io/lab: admin-10-mutating-webhook
tasks:
- id: task-01-admin-10-mutating-webhook
  title: Deploy & Configure Dynamic Admission Control & Mutating Webhooks
  description: Apply the declarative manifest for admin-10-mutating-webhook and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-10-mutating-webhook
    namespace: lab-admin-10-mutating-webhook
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-admin-10-mutating-webhook
  title: Verify Production Hardening & Labels for Dynamic Admission Control & Mutating
    Webhooks
  description: Verify metadata labels and security compliance in namespace lab-admin-10-mutating-webhook.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: admin-10-mutating-webhook
    namespace: lab-admin-10-mutating-webhook
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: admin-10-mutating-webhook
hints:
- text: Inspect the live objects with `kubectl get all -n lab-admin-10-mutating-webhook
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=admin-10-mutating-webhook
    -n lab-admin-10-mutating-webhook`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/administration/admin-10-mutating-webhook/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
