id: admin-12-coredns-custom-config
title: Custom CoreDNS Zone Forwarding & Rewrite
difficulty: intermediate
duration_minutes: 20
track: administration
objectives:
- Master Custom CoreDNS Zone Forwarding & Rewrite in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Configure CoreDNS Corefile plugins and upstream DNS
tasks:
- id: task-verify-admin-12-coredns-custom-config
  title: Verify Custom CoreDNS Zone Forwarding & Rewrite
  description: Verify metadata.name on configmaps 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: configmaps
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `configmaps` resource specifications.
  penalty_points: 10
solution: kubectl apply -f admin-12-coredns-custom-config.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
