id: cert-10-cks-mock-audit-vulnerabilities
title: 'CKS Mock: Image Scanning & Audit Policies'
difficulty: intermediate
duration_minutes: 20
track: certification
objectives:
- 'Master CKS Mock: Image Scanning & Audit Policies in Kubernetes'
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Enforce ImagePolicyWebhook and encrypt secrets at rest
tasks:
- id: task-verify-cert-10-cks-mock-audit-vulnerabilities
  title: 'Verify CKS Mock: Image Scanning & Audit Policies'
  description: Verify metadata.name on secrets 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: secrets
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `secrets` resource specifications.
  penalty_points: 10
solution: kubectl apply -f cert-10-cks-mock-audit-vulnerabilities.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
