id: gitops-02-app-of-apps-pattern
title: Enterprise App-of-Apps Architecture
difficulty: advanced
duration_minutes: 15
track: gitops
scenario: Manage multi-cluster application fleets hierarchically using the App-of-Apps
  design pattern.
objectives:
- Master Enterprise App-of-Apps Architecture architecture and declarative configurations
- Diagnose and remediate common production gotchas in gitops-02-app-of-apps-pattern
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-gitops-02-app-of-apps-pattern
      labels:
        kubelab.io/track: gitops
        kubelab.io/lab: gitops-02-app-of-apps-pattern
tasks:
- id: task-01-gitops-02-app-of-apps-pattern
  title: Deploy & Configure Enterprise App-of-Apps Architecture
  description: Apply the declarative manifest for gitops-02-app-of-apps-pattern and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-02-app-of-apps-pattern
    namespace: lab-gitops-02-app-of-apps-pattern
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-gitops-02-app-of-apps-pattern
  title: Verify Production Hardening & Labels for Enterprise App-of-Apps Architecture
  description: Verify metadata labels and security compliance in namespace lab-gitops-02-app-of-apps-pattern.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-02-app-of-apps-pattern
    namespace: lab-gitops-02-app-of-apps-pattern
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: gitops-02-app-of-apps-pattern
hints:
- text: Inspect the live objects with `kubectl get all -n lab-gitops-02-app-of-apps-pattern
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=gitops-02-app-of-apps-pattern
    -n lab-gitops-02-app-of-apps-pattern`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/gitops/gitops-02-app-of-apps-pattern/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
