id: gitops-03-automated-sync-prune
title: Automated Synchronization, Self-Healing & Pruning
difficulty: advanced
duration_minutes: 15
track: gitops
scenario: Enable automated sync policies with self-heal and resource pruning for drift
  prevention.
objectives:
- Master Automated Synchronization, Self-Healing & Pruning architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in gitops-03-automated-sync-prune
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-gitops-03-automated-sync-prune
      labels:
        kubelab.io/track: gitops
        kubelab.io/lab: gitops-03-automated-sync-prune
tasks:
- id: task-01-gitops-03-automated-sync-prune
  title: Deploy & Configure Automated Synchronization, Self-Healing & Pruning
  description: Apply the declarative manifest for gitops-03-automated-sync-prune and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-03-automated-sync-prune
    namespace: lab-gitops-03-automated-sync-prune
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-gitops-03-automated-sync-prune
  title: Verify Production Hardening & Labels for Automated Synchronization, Self-Healing
    & Pruning
  description: Verify metadata labels and security compliance in namespace lab-gitops-03-automated-sync-prune.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-03-automated-sync-prune
    namespace: lab-gitops-03-automated-sync-prune
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: gitops-03-automated-sync-prune
hints:
- text: Inspect the live objects with `kubectl get all -n lab-gitops-03-automated-sync-prune
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=gitops-03-automated-sync-prune
    -n lab-gitops-03-automated-sync-prune`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/gitops/gitops-03-automated-sync-prune/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
