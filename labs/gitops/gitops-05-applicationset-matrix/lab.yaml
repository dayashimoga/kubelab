id: gitops-05-applicationset-matrix
title: ApplicationSet Matrix & Cluster Generators
difficulty: intermediate
duration_minutes: 20
track: gitops
objectives:
- Master ApplicationSet Matrix & Cluster Generators in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Auto-generate apps across multiple tenant clusters
tasks:
- id: task-verify-gitops-05-applicationset-matrix
  title: Verify ApplicationSet Matrix & Cluster Generators
  description: Verify metadata.name on applicationsets 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: applicationsets
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `applicationsets` resource specifications.
  penalty_points: 10
solution: kubectl apply -f gitops-05-applicationset-matrix.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
