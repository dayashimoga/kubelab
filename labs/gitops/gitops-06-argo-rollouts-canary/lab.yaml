id: gitops-06-argo-rollouts-canary
title: Progressive Delivery with Argo Rollouts Canary
difficulty: advanced
duration_minutes: 15
track: gitops
scenario: Deploy zero-downtime canary releases with dynamic traffic shifting and automated
  promotions.
objectives:
- Master Progressive Delivery with Argo Rollouts Canary architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in gitops-06-argo-rollouts-canary
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-gitops-06-argo-rollouts-canary
      labels:
        kubelab.io/track: gitops
        kubelab.io/lab: gitops-06-argo-rollouts-canary
tasks:
- id: task-01-gitops-06-argo-rollouts-canary
  title: Deploy & Configure Progressive Delivery with Argo Rollouts Canary
  description: Apply the declarative manifest for gitops-06-argo-rollouts-canary and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-06-argo-rollouts-canary
    namespace: lab-gitops-06-argo-rollouts-canary
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-gitops-06-argo-rollouts-canary
  title: Verify Production Hardening & Labels for Progressive Delivery with Argo Rollouts
    Canary
  description: Verify metadata labels and security compliance in namespace lab-gitops-06-argo-rollouts-canary.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-06-argo-rollouts-canary
    namespace: lab-gitops-06-argo-rollouts-canary
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: gitops-06-argo-rollouts-canary
hints:
- text: Inspect the live objects with `kubectl get all -n lab-gitops-06-argo-rollouts-canary
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=gitops-06-argo-rollouts-canary
    -n lab-gitops-06-argo-rollouts-canary`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/gitops/gitops-06-argo-rollouts-canary/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
