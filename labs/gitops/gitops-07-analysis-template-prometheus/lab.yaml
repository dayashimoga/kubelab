id: gitops-07-analysis-template-prometheus
title: Automated Canary Metric Analysis with Prometheus
difficulty: advanced
duration_minutes: 15
track: gitops
scenario: Halt and roll back deployments automatically when Prometheus error rate
  metrics exceed thresholds.
objectives:
- Master Automated Canary Metric Analysis with Prometheus architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in gitops-07-analysis-template-prometheus
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-gitops-07-analysis-template-prometheus
      labels:
        kubelab.io/track: gitops
        kubelab.io/lab: gitops-07-analysis-template-prometheus
tasks:
- id: task-01-gitops-07-analysis-template-prometheus
  title: Deploy & Configure Automated Canary Metric Analysis with Prometheus
  description: Apply the declarative manifest for gitops-07-analysis-template-prometheus
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-07-analysis-template-prometheus
    namespace: lab-gitops-07-analysis-template-prometheus
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-gitops-07-analysis-template-prometheus
  title: Verify Production Hardening & Labels for Automated Canary Metric Analysis
    with Prometheus
  description: Verify metadata labels and security compliance in namespace lab-gitops-07-analysis-template-prometheus.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-07-analysis-template-prometheus
    namespace: lab-gitops-07-analysis-template-prometheus
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: gitops-07-analysis-template-prometheus
hints:
- text: Inspect the live objects with `kubectl get all -n lab-gitops-07-analysis-template-prometheus
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=gitops-07-analysis-template-prometheus
    -n lab-gitops-07-analysis-template-prometheus`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/gitops/gitops-07-analysis-template-prometheus/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
