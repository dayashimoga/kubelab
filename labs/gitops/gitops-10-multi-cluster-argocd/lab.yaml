id: gitops-10-multi-cluster-argocd
title: Multi-Cluster Fleet Management with Argo CD
difficulty: advanced
duration_minutes: 15
track: gitops
scenario: Register remote Kubernetes clusters and deploy applications across multiple
  regions from a central GitOps hub.
objectives:
- Master Multi-Cluster Fleet Management with Argo CD architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in gitops-10-multi-cluster-argocd
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-gitops-10-multi-cluster-argocd
      labels:
        kubelab.io/track: gitops
        kubelab.io/lab: gitops-10-multi-cluster-argocd
tasks:
- id: task-01-gitops-10-multi-cluster-argocd
  title: Deploy & Configure Multi-Cluster Fleet Management with Argo CD
  description: Apply the declarative manifest for gitops-10-multi-cluster-argocd and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-10-multi-cluster-argocd
    namespace: lab-gitops-10-multi-cluster-argocd
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-gitops-10-multi-cluster-argocd
  title: Verify Production Hardening & Labels for Multi-Cluster Fleet Management with
    Argo CD
  description: Verify metadata labels and security compliance in namespace lab-gitops-10-multi-cluster-argocd.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: gitops-10-multi-cluster-argocd
    namespace: lab-gitops-10-multi-cluster-argocd
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: gitops-10-multi-cluster-argocd
hints:
- text: Inspect the live objects with `kubectl get all -n lab-gitops-10-multi-cluster-argocd
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=gitops-10-multi-cluster-argocd
    -n lab-gitops-10-multi-cluster-argocd`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/gitops/gitops-10-multi-cluster-argocd/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
