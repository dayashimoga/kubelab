id: helm-02-values-override-templating
title: Go Templating & Values Overrides in Helm
difficulty: advanced
duration_minutes: 15
track: helm-kustomize
scenario: Master Helm Go template syntax, default values, quote functions, and conditional
  blocks.
objectives:
- Master Go Templating & Values Overrides in Helm architecture and declarative configurations
- Diagnose and remediate common production gotchas in helm-02-values-override-templating
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-helm-02-values-override-templating
      labels:
        kubelab.io/track: helm-kustomize
        kubelab.io/lab: helm-02-values-override-templating
tasks:
- id: task-01-helm-02-values-override-templating
  title: Deploy & Configure Go Templating & Values Overrides in Helm
  description: Apply the declarative manifest for helm-02-values-override-templating
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-02-values-override-templating
    namespace: lab-helm-02-values-override-templating
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-helm-02-values-override-templating
  title: Verify Production Hardening & Labels for Go Templating & Values Overrides
    in Helm
  description: Verify metadata labels and security compliance in namespace lab-helm-02-values-override-templating.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-02-values-override-templating
    namespace: lab-helm-02-values-override-templating
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: helm-02-values-override-templating
hints:
- text: Inspect the live objects with `kubectl get all -n lab-helm-02-values-override-templating
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=helm-02-values-override-templating
    -n lab-helm-02-values-override-templating`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/helm-kustomize/helm-02-values-override-templating/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
