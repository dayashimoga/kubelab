id: helm-03-named-templates-helpers
title: Named Template Partials (_helpers.tpl) & Indentation
difficulty: advanced
duration_minutes: 15
track: helm-kustomize
scenario: Write reusable partial templates with define and include while maintaining
  strict YAML indentation.
objectives:
- Master Named Template Partials (_helpers.tpl) & Indentation architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in helm-03-named-templates-helpers
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-helm-03-named-templates-helpers
      labels:
        kubelab.io/track: helm-kustomize
        kubelab.io/lab: helm-03-named-templates-helpers
tasks:
- id: task-01-helm-03-named-templates-helpers
  title: Deploy & Configure Named Template Partials (_helpers.tpl) & Indentation
  description: Apply the declarative manifest for helm-03-named-templates-helpers
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-03-named-templates-helpers
    namespace: lab-helm-03-named-templates-helpers
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-helm-03-named-templates-helpers
  title: Verify Production Hardening & Labels for Named Template Partials (_helpers.tpl)
    & Indentation
  description: Verify metadata labels and security compliance in namespace lab-helm-03-named-templates-helpers.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-03-named-templates-helpers
    namespace: lab-helm-03-named-templates-helpers
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: helm-03-named-templates-helpers
hints:
- text: Inspect the live objects with `kubectl get all -n lab-helm-03-named-templates-helpers
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=helm-03-named-templates-helpers
    -n lab-helm-03-named-templates-helpers`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/helm-kustomize/helm-03-named-templates-helpers/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
