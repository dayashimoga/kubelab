id: helm-05-hooks-lifecycle-post-install
title: Helm Lifecycle Hooks (Pre-Install & Post-Upgrade)
difficulty: advanced
duration_minutes: 15
track: helm-kustomize
scenario: Execute database migration jobs and cleanup routines using helm.sh/hook
  annotations.
objectives:
- Master Helm Lifecycle Hooks (Pre-Install & Post-Upgrade) architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in helm-05-hooks-lifecycle-post-install
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-helm-05-hooks-lifecycle-post-install
      labels:
        kubelab.io/track: helm-kustomize
        kubelab.io/lab: helm-05-hooks-lifecycle-post-install
tasks:
- id: task-01-helm-05-hooks-lifecycle-post-install
  title: Deploy & Configure Helm Lifecycle Hooks (Pre-Install & Post-Upgrade)
  description: Apply the declarative manifest for helm-05-hooks-lifecycle-post-install
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-05-hooks-lifecycle-post-install
    namespace: lab-helm-05-hooks-lifecycle-post-install
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-helm-05-hooks-lifecycle-post-install
  title: Verify Production Hardening & Labels for Helm Lifecycle Hooks (Pre-Install
    & Post-Upgrade)
  description: Verify metadata labels and security compliance in namespace lab-helm-05-hooks-lifecycle-post-install.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-05-hooks-lifecycle-post-install
    namespace: lab-helm-05-hooks-lifecycle-post-install
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: helm-05-hooks-lifecycle-post-install
hints:
- text: Inspect the live objects with `kubectl get all -n lab-helm-05-hooks-lifecycle-post-install
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=helm-05-hooks-lifecycle-post-install
    -n lab-helm-05-hooks-lifecycle-post-install`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/helm-kustomize/helm-05-hooks-lifecycle-post-install/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
