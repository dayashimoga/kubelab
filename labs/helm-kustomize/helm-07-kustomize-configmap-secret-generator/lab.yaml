  title: Deploy & Configure ConfigMap & Secret Generators with Hash Suffixes
  description: Apply the declarative manifest for helm-07-kustomize-configmap-secret-generator
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: helm-07-kustomize-configmap-secret-generator
    namespace: lab-helm-07-kustomize-configmap-secret-generator
    assertions:
    - field: status.phase
