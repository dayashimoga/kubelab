id: helm-07-kustomize-configmap-secret-generator
title: ConfigMap & Secret Generators with Hash Suffixes
difficulty: intermediate
duration_minutes: 15
track: helm-kustomize
scenario: Trigger automatic zero-downtime rolling updates when config values change
  using content hash suffixes.
objectives:
- Master ConfigMap & Secret Generators with Hash Suffixes architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in helm-07-kustomize-configmap-secret-generator
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
