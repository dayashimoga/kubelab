id: helm-09-kustomize-components-composition
title: Kustomize Components for Cross-Cutting Features
difficulty: advanced
duration_minutes: 15
track: helm-kustomize
scenario: Compose optional features (e.g. Istio sidecar injection, Prometheus monitoring)
  across overlays.
objectives:
- Master Kustomize Components for Cross-Cutting Features architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in helm-09-kustomize-components-composition
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-helm-09-kustomize-components-composition
      labels:
        kubelab.io/track: helm-kustomize
        kubelab.io/lab: helm-09-kustomize-components-composition
tasks:
- id: task-01-helm-09-kustomize-components-composition
  title: Deploy & Configure Kustomize Components for Cross-Cutting Features
  description: Apply the declarative manifest for helm-09-kustomize-components-composition
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-09-kustomize-components-composition
    namespace: lab-helm-09-kustomize-components-composition
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-helm-09-kustomize-components-composition
  title: Verify Production Hardening & Labels for Kustomize Components for Cross-Cutting
    Features
  description: Verify metadata labels and security compliance in namespace lab-helm-09-kustomize-components-composition.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-09-kustomize-components-composition
    namespace: lab-helm-09-kustomize-components-composition
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: helm-09-kustomize-components-composition
hints:
- text: Inspect the live objects with `kubectl get all -n lab-helm-09-kustomize-components-composition
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=helm-09-kustomize-components-composition
    -n lab-helm-09-kustomize-components-composition`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/helm-kustomize/helm-09-kustomize-components-composition/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
