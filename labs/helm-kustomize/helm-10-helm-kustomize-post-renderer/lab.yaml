id: helm-10-helm-kustomize-post-renderer
title: Combining Helm with Kustomize Post-Renderers
difficulty: advanced
duration_minutes: 15
track: helm-kustomize
scenario: Patch third-party Helm charts dynamically using kustomize as a post-renderer.
objectives:
- Master Combining Helm with Kustomize Post-Renderers architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in helm-10-helm-kustomize-post-renderer
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-helm-10-helm-kustomize-post-renderer
      labels:
        kubelab.io/track: helm-kustomize
        kubelab.io/lab: helm-10-helm-kustomize-post-renderer
tasks:
- id: task-01-helm-10-helm-kustomize-post-renderer
  title: Deploy & Configure Combining Helm with Kustomize Post-Renderers
  description: Apply the declarative manifest for helm-10-helm-kustomize-post-renderer
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-10-helm-kustomize-post-renderer
    namespace: lab-helm-10-helm-kustomize-post-renderer
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-helm-10-helm-kustomize-post-renderer
  title: Verify Production Hardening & Labels for Combining Helm with Kustomize Post-Renderers
  description: Verify metadata labels and security compliance in namespace lab-helm-10-helm-kustomize-post-renderer.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: helm-10-helm-kustomize-post-renderer
    namespace: lab-helm-10-helm-kustomize-post-renderer
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: helm-10-helm-kustomize-post-renderer
hints:
- text: Inspect the live objects with `kubectl get all -n lab-helm-10-helm-kustomize-post-renderer
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=helm-10-helm-kustomize-post-renderer
    -n lab-helm-10-helm-kustomize-post-renderer`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/helm-kustomize/helm-10-helm-kustomize-post-renderer/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
