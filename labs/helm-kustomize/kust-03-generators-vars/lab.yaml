id: kust-03-generators-vars
title: ConfigMap Generators & Secret Injection
difficulty: intermediate
duration_minutes: 20
track: helm-kustomize
objectives:
- Master ConfigMap Generators & Secret Injection in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Auto-generate hashed ConfigMaps from .env files
tasks:
- id: task-verify-kust-03-generators-vars
  title: Verify ConfigMap Generators & Secret Injection
  description: Verify metadata.name on configmaps 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: configmaps
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `configmaps` resource specifications.
  penalty_points: 10
solution: kubectl apply -f kust-03-generators-vars.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
