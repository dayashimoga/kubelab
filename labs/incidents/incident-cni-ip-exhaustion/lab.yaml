id: incident-cni-ip-exhaustion
title: 'Production Incident: CNI IPAM Pool Exhaustion Outage'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Fix pods stuck in ContainerCreating caused by exhausted
  Calico IPAM subnets.'
objectives:
- 'Master Production Incident: CNI IPAM Pool Exhaustion Outage architecture and declarative
  configurations'
- Diagnose and remediate common production gotchas in incident-cni-ip-exhaustion
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-cni-ip-exhaustion
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-cni-ip-exhaustion
tasks:
- id: task-01-incident-cni-ip-exhaustion
  title: 'Deploy & Configure Production Incident: CNI IPAM Pool Exhaustion Outage'
  description: Apply the declarative manifest for incident-cni-ip-exhaustion and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-cni-ip-exhaustion
    namespace: lab-incident-cni-ip-exhaustion
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-cni-ip-exhaustion
  title: 'Verify Production Hardening & Labels for Production Incident: CNI IPAM Pool
    Exhaustion Outage'
  description: Verify metadata labels and security compliance in namespace lab-incident-cni-ip-exhaustion.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-cni-ip-exhaustion
    namespace: lab-incident-cni-ip-exhaustion
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-cni-ip-exhaustion
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-cni-ip-exhaustion
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-cni-ip-exhaustion
    -n lab-incident-cni-ip-exhaustion`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-cni-ip-exhaustion/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
