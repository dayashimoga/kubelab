id: incident-coredns-failure
title: 'Production Incident: CoreDNS Outage & Cascading 503 Errors'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Diagnose CoreDNS loop crashback, repair upstream forwarders,
  and restore cluster DNS.'
objectives:
- 'Master Production Incident: CoreDNS Outage & Cascading 503 Errors architecture
  and declarative configurations'
- Diagnose and remediate common production gotchas in incident-coredns-failure
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-coredns-failure
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-coredns-failure
tasks:
- id: task-01-incident-coredns-failure
  title: 'Deploy & Configure Production Incident: CoreDNS Outage & Cascading 503 Errors'
  description: Apply the declarative manifest for incident-coredns-failure and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-coredns-failure
    namespace: lab-incident-coredns-failure
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-coredns-failure
  title: 'Verify Production Hardening & Labels for Production Incident: CoreDNS Outage
    & Cascading 503 Errors'
  description: Verify metadata labels and security compliance in namespace lab-incident-coredns-failure.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-coredns-failure
    namespace: lab-incident-coredns-failure
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-coredns-failure
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-coredns-failure
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-coredns-failure
    -n lab-incident-coredns-failure`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-coredns-failure/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
