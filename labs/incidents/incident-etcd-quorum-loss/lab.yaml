id: incident-etcd-quorum-loss
title: 'Production Incident: etcd Split-Brain & Quorum Loss'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Recover from etcd network partition and restore cluster
  consensus.'
objectives:
- 'Master Production Incident: etcd Split-Brain & Quorum Loss architecture and declarative
  configurations'
- Diagnose and remediate common production gotchas in incident-etcd-quorum-loss
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-etcd-quorum-loss
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-etcd-quorum-loss
tasks:
- id: task-01-incident-etcd-quorum-loss
  title: 'Deploy & Configure Production Incident: etcd Split-Brain & Quorum Loss'
  description: Apply the declarative manifest for incident-etcd-quorum-loss and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-etcd-quorum-loss
    namespace: lab-incident-etcd-quorum-loss
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-etcd-quorum-loss
  title: 'Verify Production Hardening & Labels for Production Incident: etcd Split-Brain
    & Quorum Loss'
  description: Verify metadata labels and security compliance in namespace lab-incident-etcd-quorum-loss.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-etcd-quorum-loss
    namespace: lab-incident-etcd-quorum-loss
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-etcd-quorum-loss
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-etcd-quorum-loss
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-etcd-quorum-loss
    -n lab-incident-etcd-quorum-loss`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-etcd-quorum-loss/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
