id: incident-gitops-sync-jam
title: 'Production Incident: GitOps Sync Deadlock & Immutable Fields'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Resolve blocked Argo CD sync storms caused by immutable
  field modification.'
objectives:
- 'Master Production Incident: GitOps Sync Deadlock & Immutable Fields architecture
  and declarative configurations'
- Diagnose and remediate common production gotchas in incident-gitops-sync-jam
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-gitops-sync-jam
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-gitops-sync-jam
tasks:
- id: task-01-incident-gitops-sync-jam
  title: 'Deploy & Configure Production Incident: GitOps Sync Deadlock & Immutable
    Fields'
  description: Apply the declarative manifest for incident-gitops-sync-jam and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-gitops-sync-jam
    namespace: lab-incident-gitops-sync-jam
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-gitops-sync-jam
  title: 'Verify Production Hardening & Labels for Production Incident: GitOps Sync
    Deadlock & Immutable Fields'
  description: Verify metadata labels and security compliance in namespace lab-incident-gitops-sync-jam.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-gitops-sync-jam
    namespace: lab-incident-gitops-sync-jam
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-gitops-sync-jam
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-gitops-sync-jam
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-gitops-sync-jam
    -n lab-incident-gitops-sync-jam`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-gitops-sync-jam/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
