id: incident-ingress-503-outage
title: 'Production Incident: Ingress Gateway 503 Outage'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Troubleshoot Ingress controller proxy timeout cascade and
  unready backend pods.'
objectives:
- 'Master Production Incident: Ingress Gateway 503 Outage architecture and declarative
  configurations'
- Diagnose and remediate common production gotchas in incident-ingress-503-outage
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-ingress-503-outage
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-ingress-503-outage
tasks:
- id: task-01-incident-ingress-503-outage
  title: 'Deploy & Configure Production Incident: Ingress Gateway 503 Outage'
  description: Apply the declarative manifest for incident-ingress-503-outage and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-ingress-503-outage
    namespace: lab-incident-ingress-503-outage
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-ingress-503-outage
  title: 'Verify Production Hardening & Labels for Production Incident: Ingress Gateway
    503 Outage'
  description: Verify metadata labels and security compliance in namespace lab-incident-ingress-503-outage.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-ingress-503-outage
    namespace: lab-incident-ingress-503-outage
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-ingress-503-outage
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-ingress-503-outage
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-ingress-503-outage
    -n lab-incident-ingress-503-outage`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-ingress-503-outage/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
