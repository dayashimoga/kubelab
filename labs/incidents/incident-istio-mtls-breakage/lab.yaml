id: incident-istio-mtls-breakage
title: 'Production Incident: Broken STRICT mTLS Communication'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Triage broken inter-service communication following misapplied
  PeerAuthentication.'
objectives:
- 'Master Production Incident: Broken STRICT mTLS Communication architecture and declarative
  configurations'
- Diagnose and remediate common production gotchas in incident-istio-mtls-breakage
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-istio-mtls-breakage
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-istio-mtls-breakage
tasks:
- id: task-01-incident-istio-mtls-breakage
  title: 'Deploy & Configure Production Incident: Broken STRICT mTLS Communication'
  description: Apply the declarative manifest for incident-istio-mtls-breakage and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-istio-mtls-breakage
    namespace: lab-incident-istio-mtls-breakage
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-istio-mtls-breakage
  title: 'Verify Production Hardening & Labels for Production Incident: Broken STRICT
    mTLS Communication'
  description: Verify metadata labels and security compliance in namespace lab-incident-istio-mtls-breakage.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-istio-mtls-breakage
    namespace: lab-incident-istio-mtls-breakage
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-istio-mtls-breakage
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-istio-mtls-breakage
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-istio-mtls-breakage
    -n lab-incident-istio-mtls-breakage`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-istio-mtls-breakage/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
