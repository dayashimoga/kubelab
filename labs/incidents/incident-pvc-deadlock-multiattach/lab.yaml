id: incident-pvc-deadlock-multiattach
title: 'Production Incident: Multi-Attach Storage Deadlock'
difficulty: advanced
duration_minutes: 15
track: incidents
scenario: 'SEV-1 War Room: Break volume attachment locks after sudden worker node
  kernel panic.'
objectives:
- 'Master Production Incident: Multi-Attach Storage Deadlock architecture and declarative
  configurations'
- Diagnose and remediate common production gotchas in incident-pvc-deadlock-multiattach
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-incident-pvc-deadlock-multiattach
      labels:
        kubelab.io/track: incidents
        kubelab.io/lab: incident-pvc-deadlock-multiattach
tasks:
- id: task-01-incident-pvc-deadlock-multiattach
  title: 'Deploy & Configure Production Incident: Multi-Attach Storage Deadlock'
  description: Apply the declarative manifest for incident-pvc-deadlock-multiattach
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-pvc-deadlock-multiattach
    namespace: lab-incident-pvc-deadlock-multiattach
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-incident-pvc-deadlock-multiattach
  title: 'Verify Production Hardening & Labels for Production Incident: Multi-Attach
    Storage Deadlock'
  description: Verify metadata labels and security compliance in namespace lab-incident-pvc-deadlock-multiattach.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: incident-pvc-deadlock-multiattach
    namespace: lab-incident-pvc-deadlock-multiattach
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: incident-pvc-deadlock-multiattach
hints:
- text: Inspect the live objects with `kubectl get all -n lab-incident-pvc-deadlock-multiattach
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=incident-pvc-deadlock-multiattach
    -n lab-incident-pvc-deadlock-multiattach`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/incidents/incident-pvc-deadlock-multiattach/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
