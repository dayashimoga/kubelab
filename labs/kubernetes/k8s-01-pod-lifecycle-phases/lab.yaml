id: k8s-01-pod-lifecycle-phases
title: Pod Lifecycle Phases, Conditions & Container Statuses
difficulty: beginner
duration_minutes: 15
track: kubernetes
scenario: 'Master the transition of Pod phases: Pending, Running, Succeeded, Failed,
  and Pod conditions: Initialized, Ready, ContainersReady.'
objectives:
- Master Pod Lifecycle Phases, Conditions & Container Statuses architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in k8s-01-pod-lifecycle-phases
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-k8s-01-pod-lifecycle-phases
      labels:
        kubelab.io/track: kubernetes
        kubelab.io/lab: k8s-01-pod-lifecycle-phases
tasks:
- id: task-01-k8s-01-pod-lifecycle-phases
  title: Deploy & Configure Pod Lifecycle Phases, Conditions & Container Statuses
  description: Apply the declarative manifest for k8s-01-pod-lifecycle-phases and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: k8s-01-pod-lifecycle-phases
    namespace: lab-k8s-01-pod-lifecycle-phases
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-k8s-01-pod-lifecycle-phases
  title: Verify Production Hardening & Labels for Pod Lifecycle Phases, Conditions
    & Container Statuses
  description: Verify metadata labels and security compliance in namespace lab-k8s-01-pod-lifecycle-phases.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: k8s-01-pod-lifecycle-phases
    namespace: lab-k8s-01-pod-lifecycle-phases
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: k8s-01-pod-lifecycle-phases
hints:
- text: Inspect the live objects with `kubectl get all -n lab-k8s-01-pod-lifecycle-phases
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=k8s-01-pod-lifecycle-phases
    -n lab-k8s-01-pod-lifecycle-phases`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/kubernetes/k8s-01-pod-lifecycle-phases/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
