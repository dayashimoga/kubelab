id: k8s-02-init-containers-dependency
title: Sequential InitContainers & Service Dependency Initialization
difficulty: beginner
duration_minutes: 15
track: kubernetes
scenario: Coordinate sequential startup dependencies using InitContainers that wait
  for upstream databases before application startup.
objectives:
- Master Sequential InitContainers & Service Dependency Initialization architecture
  and declarative configurations
- Diagnose and remediate common production gotchas in k8s-02-init-containers-dependency
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-k8s-02-init-containers-dependency
      labels:
        kubelab.io/track: kubernetes
        kubelab.io/lab: k8s-02-init-containers-dependency
tasks:
- id: task-01-k8s-02-init-containers-dependency
  title: Deploy & Configure Sequential InitContainers & Service Dependency Initialization
  description: Apply the declarative manifest for k8s-02-init-containers-dependency
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-02-init-containers-dependency
    namespace: lab-k8s-02-init-containers-dependency
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-k8s-02-init-containers-dependency
  title: Verify Production Hardening & Labels for Sequential InitContainers & Service
    Dependency Initialization
  description: Verify metadata labels and security compliance in namespace lab-k8s-02-init-containers-dependency.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-02-init-containers-dependency
    namespace: lab-k8s-02-init-containers-dependency
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: k8s-02-init-containers-dependency
hints:
- text: Inspect the live objects with `kubectl get all -n lab-k8s-02-init-containers-dependency
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=k8s-02-init-containers-dependency
    -n lab-k8s-02-init-containers-dependency`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/kubernetes/k8s-02-init-containers-dependency/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
