id: k8s-06-secrets-base64-tls
title: Kubernetes Secrets, TLS Certificates & Immutable Keys
difficulty: intermediate
duration_minutes: 15
track: kubernetes
scenario: Manage Opaque and TLS secrets with base64 encoding, projected volumes, and
  immutable secret flags.
objectives:
- Master Kubernetes Secrets, TLS Certificates & Immutable Keys architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in k8s-06-secrets-base64-tls
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-k8s-06-secrets-base64-tls
      labels:
        kubelab.io/track: kubernetes
        kubelab.io/lab: k8s-06-secrets-base64-tls
tasks:
- id: task-01-k8s-06-secrets-base64-tls
  title: Deploy & Configure Kubernetes Secrets, TLS Certificates & Immutable Keys
  description: Apply the declarative manifest for k8s-06-secrets-base64-tls and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: k8s-06-secrets-base64-tls
    namespace: lab-k8s-06-secrets-base64-tls
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-k8s-06-secrets-base64-tls
  title: Verify Production Hardening & Labels for Kubernetes Secrets, TLS Certificates
    & Immutable Keys
  description: Verify metadata labels and security compliance in namespace lab-k8s-06-secrets-base64-tls.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: k8s-06-secrets-base64-tls
    namespace: lab-k8s-06-secrets-base64-tls
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: k8s-06-secrets-base64-tls
hints:
- text: Inspect the live objects with `kubectl get all -n lab-k8s-06-secrets-base64-tls
