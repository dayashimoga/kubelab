id: k8s-07-resource-requests-limits
title: Quality of Service (QoS) Classes & Resource Bounds
difficulty: beginner
duration_minutes: 15
track: kubernetes
scenario: Configure Guaranteed, Burstable, and BestEffort QoS classes with CPU CFS
  quotas and memory limits.
objectives:
- Master Quality of Service (QoS) Classes & Resource Bounds architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in k8s-07-resource-requests-limits
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-k8s-07-resource-requests-limits
      labels:
        kubelab.io/track: kubernetes
        kubelab.io/lab: k8s-07-resource-requests-limits
tasks:
- id: task-01-k8s-07-resource-requests-limits
  title: Deploy & Configure Quality of Service (QoS) Classes & Resource Bounds
  description: Apply the declarative manifest for k8s-07-resource-requests-limits
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-07-resource-requests-limits
    namespace: lab-k8s-07-resource-requests-limits
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-k8s-07-resource-requests-limits
  title: Verify Production Hardening & Labels for Quality of Service (QoS) Classes
    & Resource Bounds
  description: Verify metadata labels and security compliance in namespace lab-k8s-07-resource-requests-limits.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-07-resource-requests-limits
    namespace: lab-k8s-07-resource-requests-limits
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: k8s-07-resource-requests-limits
hints:
- text: Inspect the live objects with `kubectl get all -n lab-k8s-07-resource-requests-limits
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=k8s-07-resource-requests-limits
    -n lab-k8s-07-resource-requests-limits`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/kubernetes/k8s-07-resource-requests-limits/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
