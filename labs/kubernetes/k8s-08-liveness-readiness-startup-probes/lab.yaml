id: k8s-08-liveness-readiness-startup-probes
title: Liveness, Readiness & Startup Probes Deep Dive
difficulty: beginner
duration_minutes: 15
track: kubernetes
scenario: Implement HTTP, TCP socket, and Exec probes to automate failure recovery
  and zero-downtime routing.
objectives:
- Master Liveness, Readiness & Startup Probes Deep Dive architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in k8s-08-liveness-readiness-startup-probes
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-k8s-08-liveness-readiness-startup-probes
      labels:
        kubelab.io/track: kubernetes
        kubelab.io/lab: k8s-08-liveness-readiness-startup-probes
tasks:
- id: task-01-k8s-08-liveness-readiness-startup-probes
  title: Deploy & Configure Liveness, Readiness & Startup Probes Deep Dive
  description: Apply the declarative manifest for k8s-08-liveness-readiness-startup-probes
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-08-liveness-readiness-startup-probes
    namespace: lab-k8s-08-liveness-readiness-startup-probes
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-k8s-08-liveness-readiness-startup-probes
  title: Verify Production Hardening & Labels for Liveness, Readiness & Startup Probes
    Deep Dive
  description: Verify metadata labels and security compliance in namespace lab-k8s-08-liveness-readiness-startup-probes.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: k8s-08-liveness-readiness-startup-probes
    namespace: lab-k8s-08-liveness-readiness-startup-probes
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: k8s-08-liveness-readiness-startup-probes
hints:
- text: Inspect the live objects with `kubectl get all -n lab-k8s-08-liveness-readiness-startup-probes
