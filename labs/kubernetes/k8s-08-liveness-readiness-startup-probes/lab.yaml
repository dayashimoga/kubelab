  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=k8s-08-liveness-readiness-startup-probes
    -n lab-k8s-08-liveness-readiness-startup-probes`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/kubernetes/k8s-08-liveness-readiness-startup-probes/solution.yaml
cleanup:
  auto: true
