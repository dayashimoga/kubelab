id: k8s-deployments-scaling
title: Deployments, Scaling and Rolling Updates
difficulty: beginner
duration_minutes: 20
track: kubernetes
objectives:
- Master Deployments, Scaling and Rolling Updates in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Deploy a 3-replica API deployment and verify all 3 replicas are in Ready state.
tasks:
- id: task-1
  title: Verify 3 ready replicas
  description: Verify status.readyReplicas on deployments 'api-deployment'
  points: 100
  validation:
    type: k8s_resource
    resource: deployments
    name: api-deployment
    namespace: null
    assertions:
    - field: status.readyReplicas
      operator: equals
      expected: 3
      actual: null
      passed: null
      error_message: null
hints:
- text: kubectl create deployment api-deployment --image=nginx:alpine --replicas=3
  penalty_points: 10
solution: kubectl create deployment api-deployment --image=nginx:alpine --replicas=3
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
