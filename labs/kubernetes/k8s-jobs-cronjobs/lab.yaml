id: k8s-jobs-cronjobs
title: Batch Processing with Jobs & CronJobs
difficulty: intermediate
duration_minutes: 20
track: kubernetes
objectives:
- Master Batch Processing with Jobs & CronJobs in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: 'Create CronJob nightly-report running schedule `0 2 * * *` with successfulJobsHistoryLimit: 3.'
tasks:
- id: task-1
  title: Configure CronJob schedule
  description: Verify spec.schedule on cronjobs 'nightly-report'
  points: 50
  validation:
    type: k8s_resource
    resource: cronjobs
    name: nightly-report
    namespace: null
    assertions:
    - field: spec.schedule
      operator: equals
      expected: 0 2 * * *
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: History limit 3
  description: Verify spec.successfulJobsHistoryLimit on cronjobs 'nightly-report'
  points: 50
  validation:
    type: k8s_resource
    resource: cronjobs
    name: nightly-report
    namespace: null
    assertions:
    - field: spec.successfulJobsHistoryLimit
      operator: equals
      expected: 3
      actual: null
      passed: null
      error_message: null
hints:
- text: kubectl create cronjob nightly-report --image=alpine --schedule='0 2 * * *' -- /bin/sh -c 'date'
  penalty_points: 10
solution: kubectl create cronjob nightly-report --image=alpine --schedule='0 2 * * *' -- /bin/sh -c 'date'
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
