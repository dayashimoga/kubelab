id: k8s-pod-basics
title: Create and Configure Your First Pod
difficulty: beginner
duration_minutes: 15
track: kubernetes
objectives:
- Master Create and Configure Your First Pod in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Deploy a stateless frontend container named web-server on port 80 with label app=frontend.
tasks:
- id: task-deploy-pod
  title: Deploy web-server pod
  description: Verify status.phase on pods 'web-server'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: web-server
    namespace: null
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
      actual: null
      passed: null
      error_message: null
- id: task-verify-port
  title: Verify container port
  description: Verify spec.containers[0].ports[0].containerPort on pods 'web-server'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: web-server
    namespace: null
    assertions:
    - field: spec.containers[0].ports[0].containerPort
      operator: equals
      expected: 80
      actual: null
      passed: null
      error_message: null
hints:
- text: Use `kubectl run web-server --image=nginx:alpine --port=80 -l app=frontend`
  penalty_points: 10
solution: kubectl run web-server --image=nginx:alpine --port=80 -l app=frontend
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 20
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
