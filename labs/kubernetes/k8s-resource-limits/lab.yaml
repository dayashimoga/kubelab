id: k8s-resource-limits
title: Pod Resource Requests, Limits & Guaranteed QoS
difficulty: intermediate
duration_minutes: 20
track: kubernetes
objectives:
- Master Pod Resource Requests, Limits & Guaranteed QoS in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: 'Set identical requests and limits (cpu: 200m, memory: 256Mi) to achieve Guaranteed QoS class.'
tasks:
- id: task-1
  title: CPU request 200m
  description: Verify spec.containers[0].resources.requests.cpu on pods 'guaranteed-pod'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: guaranteed-pod
    namespace: null
    assertions:
    - field: spec.containers[0].resources.requests.cpu
      operator: equals
      expected: 200m
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: Memory limit 256Mi
  description: Verify spec.containers[0].resources.limits.memory on pods 'guaranteed-pod'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: guaranteed-pod
    namespace: null
    assertions:
    - field: spec.containers[0].resources.limits.memory
      operator: equals
      expected: 256Mi
      actual: null
      passed: null
      error_message: null
hints:
- text: Specify equal requests and limits for cpu and memory.
  penalty_points: 10
solution: kubectl apply -f guaranteed-qos.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
