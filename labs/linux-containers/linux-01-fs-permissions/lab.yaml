id: linux-01-fs-permissions
title: Linux Filesystem Hierarchy & POSIX Permissions
difficulty: beginner
duration_minutes: 15
track: linux-containers
scenario: Enforce strict 600 file permissions, root:root ownership, and audit setuid/setgid
  binaries on sensitive tokens.
objectives:
- Master Linux Filesystem Hierarchy & POSIX Permissions architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in linux-01-fs-permissions
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-linux-01-fs-permissions
      labels:
        kubelab.io/track: linux-containers
        kubelab.io/lab: linux-01-fs-permissions
tasks:
- id: task-01-linux-01-fs-permissions
  title: Deploy & Configure Linux Filesystem Hierarchy & POSIX Permissions
  description: Apply the declarative manifest for linux-01-fs-permissions and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-01-fs-permissions
    namespace: lab-linux-01-fs-permissions
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-linux-01-fs-permissions
  title: Verify Production Hardening & Labels for Linux Filesystem Hierarchy & POSIX
    Permissions
  description: Verify metadata labels and security compliance in namespace lab-linux-01-fs-permissions.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-01-fs-permissions
    namespace: lab-linux-01-fs-permissions
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: linux-01-fs-permissions
hints:
- text: Inspect the live objects with `kubectl get all -n lab-linux-01-fs-permissions
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=linux-01-fs-permissions
    -n lab-linux-01-fs-permissions`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/linux-containers/linux-01-fs-permissions/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
