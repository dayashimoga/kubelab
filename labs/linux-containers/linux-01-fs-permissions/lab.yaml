id: linux-01-fs-permissions
title: Linux Filesystem Hierarchy & POSIX Permissions
difficulty: beginner
duration_minutes: 15
track: linux-containers
objectives:
- Master Linux Filesystem Hierarchy & POSIX Permissions in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Enforce strict 600 file permissions and root:root ownership on secret token files.
tasks:
- id: task-1
  title: Deploy secure agent pod
  description: Verify status.phase on pods 'sec-agent'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-agent
    namespace: null
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: Label application tier
  description: Verify metadata.labels.tier on pods 'sec-agent'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-agent
    namespace: null
    assertions:
    - field: metadata.labels.tier
      operator: equals
      expected: agent
      actual: null
      passed: null
      error_message: null
hints:
- text: Use `chmod 600 /etc/secrets/token` and `chown 0:0 /etc/secrets/token`
  penalty_points: 10
solution: kubectl run sec-agent --image=alpine --labels=tier=agent -- sleep 3600
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 20
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
