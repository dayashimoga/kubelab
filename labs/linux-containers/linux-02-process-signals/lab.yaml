id: linux-02-process-signals
title: Process Lifecycle & Graceful SIGTERM Shutdown
difficulty: beginner
duration_minutes: 15
track: linux-containers
scenario: Configure 30-second graceful terminationGracePeriodSeconds to handle SIGTERM
  without dropping in-flight HTTP connections.
objectives:
- Master Process Lifecycle & Graceful SIGTERM Shutdown architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in linux-02-process-signals
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-linux-02-process-signals
      labels:
        kubelab.io/track: linux-containers
        kubelab.io/lab: linux-02-process-signals
tasks:
- id: task-01-linux-02-process-signals
  title: Deploy & Configure Process Lifecycle & Graceful SIGTERM Shutdown
  description: Apply the declarative manifest for linux-02-process-signals and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-02-process-signals
    namespace: lab-linux-02-process-signals
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-linux-02-process-signals
  title: Verify Production Hardening & Labels for Process Lifecycle & Graceful SIGTERM
    Shutdown
  description: Verify metadata labels and security compliance in namespace lab-linux-02-process-signals.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-02-process-signals
    namespace: lab-linux-02-process-signals
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: linux-02-process-signals
hints:
- text: Inspect the live objects with `kubectl get all -n lab-linux-02-process-signals
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=linux-02-process-signals
    -n lab-linux-02-process-signals`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/linux-containers/linux-02-process-signals/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
