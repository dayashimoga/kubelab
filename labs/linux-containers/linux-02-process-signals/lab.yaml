id: linux-02-process-signals
title: Process Lifecycle & Graceful SIGTERM Shutdown
difficulty: beginner
duration_minutes: 15
track: linux-containers
objectives:
- Master Process Lifecycle & Graceful SIGTERM Shutdown in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Configure 30-second graceful terminationGracePeriodSeconds to handle SIGTERM without dropping connections.
tasks:
- id: task-1
  title: Configure 30s grace period
  description: Verify spec.terminationGracePeriodSeconds on pods 'graceful-svc'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: graceful-svc
    namespace: null
    assertions:
    - field: spec.terminationGracePeriodSeconds
      operator: equals
      expected: 30
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: Ensure pod is running
  description: Verify status.phase on pods 'graceful-svc'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: graceful-svc
    namespace: null
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
      actual: null
      passed: null
      error_message: null
hints:
- text: 'Set terminationGracePeriodSeconds: 30 in the pod spec.'
  penalty_points: 10
solution: kubectl apply -f graceful-pod.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 20
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
