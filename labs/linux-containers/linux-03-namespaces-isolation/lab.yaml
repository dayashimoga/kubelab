id: linux-03-namespaces-isolation
title: Linux Namespaces (PID, MNT, NET) Isolation
difficulty: intermediate
duration_minutes: 20
track: linux-containers
objectives:
- Master Linux Namespaces (PID, MNT, NET) Isolation in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: 'Isolate container process tree by strictly enforcing hostPID: false and hostNetwork: false.'
tasks:
- id: task-1
  title: Enforce hostPID false
  description: Verify spec.hostPID on pods 'isolated-node'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: isolated-node
    namespace: null
    assertions:
    - field: spec.hostPID
      operator: equals
      expected: false
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: Enforce hostNetwork false
  description: Verify spec.hostNetwork on pods 'isolated-node'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: isolated-node
    namespace: null
    assertions:
    - field: spec.hostNetwork
      operator: equals
      expected: false
      actual: null
      passed: null
      error_message: null
hints:
- text: Omit hostPID and hostNetwork or set them explicitly to false.
  penalty_points: 10
solution: kubectl apply -f isolated-pod.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
