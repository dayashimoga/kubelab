id: linux-03-namespaces-isolation
title: Linux Namespaces & Container Process Isolation
difficulty: beginner
duration_minutes: 15
track: linux-containers
scenario: Explore PID, NET, MNT, IPC, UTS, and USER kernel namespaces using unshare
  and nsenter.
objectives:
- Master Linux Namespaces & Container Process Isolation architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in linux-03-namespaces-isolation
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-linux-03-namespaces-isolation
      labels:
        kubelab.io/track: linux-containers
        kubelab.io/lab: linux-03-namespaces-isolation
tasks:
- id: task-01-linux-03-namespaces-isolation
  title: Deploy & Configure Linux Namespaces & Container Process Isolation
  description: Apply the declarative manifest for linux-03-namespaces-isolation and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-03-namespaces-isolation
    namespace: lab-linux-03-namespaces-isolation
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-linux-03-namespaces-isolation
  title: Verify Production Hardening & Labels for Linux Namespaces & Container Process
    Isolation
  description: Verify metadata labels and security compliance in namespace lab-linux-03-namespaces-isolation.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-03-namespaces-isolation
    namespace: lab-linux-03-namespaces-isolation
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: linux-03-namespaces-isolation
hints:
- text: Inspect the live objects with `kubectl get all -n lab-linux-03-namespaces-isolation
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=linux-03-namespaces-isolation
    -n lab-linux-03-namespaces-isolation`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/linux-containers/linux-03-namespaces-isolation/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
