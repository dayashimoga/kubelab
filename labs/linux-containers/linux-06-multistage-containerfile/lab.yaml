id: linux-06-multistage-containerfile
title: Multi-Stage Containerfile Optimization & Distroless Base
difficulty: beginner
duration_minutes: 15
track: linux-containers
scenario: Minimize attack surface and image size using multi-stage builds, non-root
  users, and scratch/distroless bases.
objectives:
- Master Multi-Stage Containerfile Optimization & Distroless Base architecture and
  declarative configurations
- Diagnose and remediate common production gotchas in linux-06-multistage-containerfile
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-linux-06-multistage-containerfile
      labels:
        kubelab.io/track: linux-containers
        kubelab.io/lab: linux-06-multistage-containerfile
tasks:
- id: task-01-linux-06-multistage-containerfile
  title: Deploy & Configure Multi-Stage Containerfile Optimization & Distroless Base
  description: Apply the declarative manifest for linux-06-multistage-containerfile
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-06-multistage-containerfile
    namespace: lab-linux-06-multistage-containerfile
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-linux-06-multistage-containerfile
  title: Verify Production Hardening & Labels for Multi-Stage Containerfile Optimization
    & Distroless Base
  description: Verify metadata labels and security compliance in namespace lab-linux-06-multistage-containerfile.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: linux-06-multistage-containerfile
    namespace: lab-linux-06-multistage-containerfile
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: linux-06-multistage-containerfile
hints:
- text: Inspect the live objects with `kubectl get all -n lab-linux-06-multistage-containerfile
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=linux-06-multistage-containerfile
    -n lab-linux-06-multistage-containerfile`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/linux-containers/linux-06-multistage-containerfile/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
