id: linux-06-podman-rootless
title: Rootless Container Execution & User Namespaces
difficulty: intermediate
duration_minutes: 20
track: linux-containers
objectives:
- Master Rootless Container Execution & User Namespaces in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Run container as non-root user UID 10001 with read-only root filesystem.
tasks:
- id: task-1
  title: Set runAsNonRoot true
  description: Verify spec.securityContext.runAsNonRoot on pods 'rootless-workload'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: rootless-workload
    namespace: null
    assertions:
    - field: spec.securityContext.runAsNonRoot
      operator: equals
      expected: true
      actual: null
      passed: null
      error_message: null
- id: task-2
  title: Set runAsUser 10001
  description: Verify spec.securityContext.runAsUser on pods 'rootless-workload'
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: rootless-workload
    namespace: null
    assertions:
    - field: spec.securityContext.runAsUser
      operator: equals
      expected: 10001
      actual: null
      passed: null
      error_message: null
hints:
- text: Configure securityContext with runAsNonRoot and runAsUser.
  penalty_points: 10
solution: kubectl apply -f rootless-workload.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
