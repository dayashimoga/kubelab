id: linux-08-oci-spec-runtime
title: OCI Runtime Spec & Seccomp Profile Activation
difficulty: advanced
duration_minutes: 25
track: linux-containers
objectives:
- Master OCI Runtime Spec & Seccomp Profile Activation in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Enable RuntimeDefault seccomp profile across all container processes.
tasks:
- id: task-1
  title: Activate RuntimeDefault seccomp
  description: Verify spec.securityContext.seccompProfile.type on pods 'hardened-oci'
  points: 100
  validation:
    type: k8s_resource
    resource: pods
    name: hardened-oci
    namespace: null
    assertions:
    - field: spec.securityContext.seccompProfile.type
      operator: equals
      expected: RuntimeDefault
      actual: null
      passed: null
      error_message: null
hints:
- text: Set securityContext.seccompProfile.type to RuntimeDefault.
  penalty_points: 10
solution: kubectl apply -f hardened-oci.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 30
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
