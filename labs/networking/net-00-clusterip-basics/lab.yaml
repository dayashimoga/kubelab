id: "net-00-clusterip-basics"
title: "Exposing Pods with ClusterIP & Endpoints"
difficulty: "beginner"
duration_minutes: 15
track: "networking"
prerequisites:
  - "k8s-deployments-scaling"
environment:
  type: "kubernetes"
  cluster: "disposable"
  namespace_isolation: true
  resources:
    cpu_limit: "500m"
    memory_limit: "512Mi"
initial_state:
  manifests: []
scenario: |
  Create a ClusterIP service named `auth-service` that exposes Pods with label `app=auth` on port 8080 targeting container port 8080.
tasks:
  - id: "task-create-service"
    title: "Create ClusterIP Service"
    description: "Create a Service named auth-service with type ClusterIP routing to app=auth"
    points: 100
    validation:
      type: "k8s_resource"
      resource: "services"
      name: "auth-service"
      assertions:
        - field: "spec.type"
          operator: "equals"
          expected: "ClusterIP"
        - field: "spec.ports[0].port"
          operator: "equals"
          expected: 8080
        - field: "spec.selector.app"
          operator: "equals"
          expected: "auth"
hints:
  - text: "Use `kubectl expose deployment auth-server --name=auth-service --port=8080 --target-port=8080`"
    penalty_points: 10
solution: |
  kubectl expose deployment auth-server --name=auth-service --port=8080 --target-port=8080
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 20
