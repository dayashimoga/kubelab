id: net-01-clusterip-deepdive
title: ClusterIP Service Deep Dive & iptables
difficulty: intermediate
duration_minutes: 20
track: networking
objectives:
- Master ClusterIP Service Deep Dive & iptables in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Verify service endpoints and kube-proxy rules
tasks:
- id: task-verify-net-01-clusterip-deepdive
  title: Verify ClusterIP Service Deep Dive & iptables
  description: Verify metadata.name on services 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: services
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `services` resource specifications.
  penalty_points: 10
solution: kubectl apply -f net-01-clusterip-deepdive.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
