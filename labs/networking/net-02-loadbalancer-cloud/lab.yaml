id: net-02-loadbalancer-cloud
title: LoadBalancer Services & Cloud Provider Integration
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Provision cloud load balancers with health checks and external-ip allocations.
objectives:
- Master LoadBalancer Services & Cloud Provider Integration architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-02-loadbalancer-cloud
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-02-loadbalancer-cloud
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-02-loadbalancer-cloud
tasks:
- id: task-01-net-02-loadbalancer-cloud
  title: Deploy & Configure LoadBalancer Services & Cloud Provider Integration
  description: Apply the declarative manifest for net-02-loadbalancer-cloud and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-02-loadbalancer-cloud
    namespace: lab-net-02-loadbalancer-cloud
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-02-loadbalancer-cloud
  title: Verify Production Hardening & Labels for LoadBalancer Services & Cloud Provider
    Integration
  description: Verify metadata labels and security compliance in namespace lab-net-02-loadbalancer-cloud.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-02-loadbalancer-cloud
    namespace: lab-net-02-loadbalancer-cloud
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-02-loadbalancer-cloud
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-02-loadbalancer-cloud
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-02-loadbalancer-cloud
    -n lab-net-02-loadbalancer-cloud`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-02-loadbalancer-cloud/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
