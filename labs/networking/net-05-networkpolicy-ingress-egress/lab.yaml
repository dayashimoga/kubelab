id: net-05-networkpolicy-ingress-egress
title: Fine-Grained Ingress & Egress NetworkPolicies
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Allow specific ingress from frontend pods and egress to database CIDRs on
  dedicated ports.
objectives:
- Master Fine-Grained Ingress & Egress NetworkPolicies architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-05-networkpolicy-ingress-egress
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-05-networkpolicy-ingress-egress
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-05-networkpolicy-ingress-egress
tasks:
- id: task-01-net-05-networkpolicy-ingress-egress
  title: Deploy & Configure Fine-Grained Ingress & Egress NetworkPolicies
  description: Apply the declarative manifest for net-05-networkpolicy-ingress-egress
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-05-networkpolicy-ingress-egress
    namespace: lab-net-05-networkpolicy-ingress-egress
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-05-networkpolicy-ingress-egress
  title: Verify Production Hardening & Labels for Fine-Grained Ingress & Egress NetworkPolicies
  description: Verify metadata labels and security compliance in namespace lab-net-05-networkpolicy-ingress-egress.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-05-networkpolicy-ingress-egress
    namespace: lab-net-05-networkpolicy-ingress-egress
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-05-networkpolicy-ingress-egress
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-05-networkpolicy-ingress-egress
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-05-networkpolicy-ingress-egress
    -n lab-net-05-networkpolicy-ingress-egress`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-05-networkpolicy-ingress-egress/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
