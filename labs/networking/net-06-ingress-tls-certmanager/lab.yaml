id: net-06-ingress-tls-certmanager
title: Automated TLS Certificates with cert-manager
difficulty: intermediate
duration_minutes: 20
track: networking
objectives:
- Master Automated TLS Certificates with cert-manager in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Issue Let's Encrypt TLS secret for Ingress
tasks:
- id: task-verify-net-06-ingress-tls-certmanager
  title: Verify Automated TLS Certificates with cert-manager
  description: Verify metadata.name on certificates 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: certificates
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `certificates` resource specifications.
  penalty_points: 10
solution: kubectl apply -f net-06-ingress-tls-certmanager.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
