id: net-07-metallb-baremetal-bgp
title: MetalLB LoadBalancer for Bare-Metal Clusters
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Deploy MetalLB with IPAddressPools and L2/BGP advertisements for on-prem
  LoadBalancers.
objectives:
- Master MetalLB LoadBalancer for Bare-Metal Clusters architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-07-metallb-baremetal-bgp
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-07-metallb-baremetal-bgp
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-07-metallb-baremetal-bgp
tasks:
- id: task-01-net-07-metallb-baremetal-bgp
  title: Deploy & Configure MetalLB LoadBalancer for Bare-Metal Clusters
  description: Apply the declarative manifest for net-07-metallb-baremetal-bgp and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-07-metallb-baremetal-bgp
    namespace: lab-net-07-metallb-baremetal-bgp
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-07-metallb-baremetal-bgp
  title: Verify Production Hardening & Labels for MetalLB LoadBalancer for Bare-Metal
    Clusters
  description: Verify metadata labels and security compliance in namespace lab-net-07-metallb-baremetal-bgp.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-07-metallb-baremetal-bgp
    namespace: lab-net-07-metallb-baremetal-bgp
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-07-metallb-baremetal-bgp
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-07-metallb-baremetal-bgp
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-07-metallb-baremetal-bgp
    -n lab-net-07-metallb-baremetal-bgp`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-07-metallb-baremetal-bgp/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
