id: net-09-calico-bgp-peering
title: Calico CNI IPPools & BGP Route Distribution
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Configure Calico IP pools, VXLAN encapsulation, and BGP peering with Top-of-Rack
  switches.
objectives:
- Master Calico CNI IPPools & BGP Route Distribution architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-09-calico-bgp-peering
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-09-calico-bgp-peering
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-09-calico-bgp-peering
tasks:
- id: task-01-net-09-calico-bgp-peering
  title: Deploy & Configure Calico CNI IPPools & BGP Route Distribution
  description: Apply the declarative manifest for net-09-calico-bgp-peering and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-09-calico-bgp-peering
    namespace: lab-net-09-calico-bgp-peering
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-09-calico-bgp-peering
  title: Verify Production Hardening & Labels for Calico CNI IPPools & BGP Route Distribution
  description: Verify metadata labels and security compliance in namespace lab-net-09-calico-bgp-peering.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-09-calico-bgp-peering
    namespace: lab-net-09-calico-bgp-peering
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-09-calico-bgp-peering
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-09-calico-bgp-peering
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-09-calico-bgp-peering
    -n lab-net-09-calico-bgp-peering`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-09-calico-bgp-peering/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
