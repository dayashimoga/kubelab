id: net-10-gateway-api-httproute
title: Kubernetes Gateway API & HTTPRoute Splitting
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Adopt the next-generation Gateway API with GatewayClasses, Gateways, and
  HTTPRoutes.
objectives:
- Master Kubernetes Gateway API & HTTPRoute Splitting architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-10-gateway-api-httproute
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-10-gateway-api-httproute
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-10-gateway-api-httproute
tasks:
- id: task-01-net-10-gateway-api-httproute
  title: Deploy & Configure Kubernetes Gateway API & HTTPRoute Splitting
  description: Apply the declarative manifest for net-10-gateway-api-httproute and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-10-gateway-api-httproute
    namespace: lab-net-10-gateway-api-httproute
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-10-gateway-api-httproute
  title: Verify Production Hardening & Labels for Kubernetes Gateway API & HTTPRoute
    Splitting
  description: Verify metadata labels and security compliance in namespace lab-net-10-gateway-api-httproute.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-10-gateway-api-httproute
    namespace: lab-net-10-gateway-api-httproute
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-10-gateway-api-httproute
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-10-gateway-api-httproute
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-10-gateway-api-httproute
    -n lab-net-10-gateway-api-httproute`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-10-gateway-api-httproute/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
