id: net-11-dual-stack-ipv4-ipv6
title: IPv4/IPv6 Dual-Stack Service & Pod Networking
difficulty: advanced
duration_minutes: 15
track: networking
scenario: Configure dual-stack pod networking and multi-family ClusterIP services.
objectives:
- Master IPv4/IPv6 Dual-Stack Service & Pod Networking architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in net-11-dual-stack-ipv4-ipv6
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-net-11-dual-stack-ipv4-ipv6
      labels:
        kubelab.io/track: networking
        kubelab.io/lab: net-11-dual-stack-ipv4-ipv6
tasks:
- id: task-01-net-11-dual-stack-ipv4-ipv6
  title: Deploy & Configure IPv4/IPv6 Dual-Stack Service & Pod Networking
  description: Apply the declarative manifest for net-11-dual-stack-ipv4-ipv6 and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-11-dual-stack-ipv4-ipv6
    namespace: lab-net-11-dual-stack-ipv4-ipv6
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-net-11-dual-stack-ipv4-ipv6
  title: Verify Production Hardening & Labels for IPv4/IPv6 Dual-Stack Service & Pod
    Networking
  description: Verify metadata labels and security compliance in namespace lab-net-11-dual-stack-ipv4-ipv6.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: net-11-dual-stack-ipv4-ipv6
    namespace: lab-net-11-dual-stack-ipv4-ipv6
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: net-11-dual-stack-ipv4-ipv6
hints:
- text: Inspect the live objects with `kubectl get all -n lab-net-11-dual-stack-ipv4-ipv6
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=net-11-dual-stack-ipv4-ipv6
    -n lab-net-11-dual-stack-ipv4-ipv6`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/networking/net-11-dual-stack-ipv4-ipv6/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
