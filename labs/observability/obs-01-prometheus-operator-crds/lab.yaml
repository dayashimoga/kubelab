id: obs-01-prometheus-operator-crds
title: Deploying Prometheus Operator & Core CRDs
difficulty: intermediate
duration_minutes: 15
track: observability
scenario: Deploy Prometheus, Alertmanager, and ServiceMonitor custom resource definitions.
objectives:
- Master Deploying Prometheus Operator & Core CRDs architecture and declarative configurations
- Diagnose and remediate common production gotchas in obs-01-prometheus-operator-crds
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-obs-01-prometheus-operator-crds
      labels:
        kubelab.io/track: observability
        kubelab.io/lab: obs-01-prometheus-operator-crds
tasks:
- id: task-01-obs-01-prometheus-operator-crds
  title: Deploy & Configure Deploying Prometheus Operator & Core CRDs
  description: Apply the declarative manifest for obs-01-prometheus-operator-crds
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-01-prometheus-operator-crds
    namespace: lab-obs-01-prometheus-operator-crds
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-obs-01-prometheus-operator-crds
  title: Verify Production Hardening & Labels for Deploying Prometheus Operator &
    Core CRDs
  description: Verify metadata labels and security compliance in namespace lab-obs-01-prometheus-operator-crds.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-01-prometheus-operator-crds
    namespace: lab-obs-01-prometheus-operator-crds
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: obs-01-prometheus-operator-crds
hints:
- text: Inspect the live objects with `kubectl get all -n lab-obs-01-prometheus-operator-crds
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=obs-01-prometheus-operator-crds
    -n lab-obs-01-prometheus-operator-crds`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/observability/obs-01-prometheus-operator-crds/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
