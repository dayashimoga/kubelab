- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Configure custom metrics scraping on /metrics
tasks:
