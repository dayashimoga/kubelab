    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `servicemonitors` resource specifications.
  penalty_points: 10
solution: kubectl apply -f obs-01-prometheus-scrape-configs.yaml
cleanup:
  auto: true
