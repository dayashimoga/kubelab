id: obs-04-alertmanager-routing-receivers
title: Alertmanager Notification Routing & Inhabitation
difficulty: intermediate
duration_minutes: 15
track: observability
scenario: Route alerts to Slack, PagerDuty, and email with grouping and silence inhibitions.
objectives:
- Master Alertmanager Notification Routing & Inhabitation architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in obs-04-alertmanager-routing-receivers
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-obs-04-alertmanager-routing-receivers
      labels:
        kubelab.io/track: observability
        kubelab.io/lab: obs-04-alertmanager-routing-receivers
tasks:
- id: task-01-obs-04-alertmanager-routing-receivers
  title: Deploy & Configure Alertmanager Notification Routing & Inhabitation
  description: Apply the declarative manifest for obs-04-alertmanager-routing-receivers
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-04-alertmanager-routing-receivers
    namespace: lab-obs-04-alertmanager-routing-receivers
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-obs-04-alertmanager-routing-receivers
  title: Verify Production Hardening & Labels for Alertmanager Notification Routing
    & Inhabitation
  description: Verify metadata labels and security compliance in namespace lab-obs-04-alertmanager-routing-receivers.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-04-alertmanager-routing-receivers
    namespace: lab-obs-04-alertmanager-routing-receivers
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: obs-04-alertmanager-routing-receivers
hints:
- text: Inspect the live objects with `kubectl get all -n lab-obs-04-alertmanager-routing-receivers
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=obs-04-alertmanager-routing-receivers
    -n lab-obs-04-alertmanager-routing-receivers`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/observability/obs-04-alertmanager-routing-receivers/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
