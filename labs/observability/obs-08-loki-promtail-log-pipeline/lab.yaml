id: obs-08-loki-promtail-log-pipeline
title: Log Aggregation with Grafana Loki & Promtail
difficulty: intermediate
duration_minutes: 15
track: observability
scenario: Ship, index, and query structured container logs using Promtail and LogQL.
objectives:
- Master Log Aggregation with Grafana Loki & Promtail architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in obs-08-loki-promtail-log-pipeline
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-obs-08-loki-promtail-log-pipeline
      labels:
        kubelab.io/track: observability
        kubelab.io/lab: obs-08-loki-promtail-log-pipeline
tasks:
- id: task-01-obs-08-loki-promtail-log-pipeline
  title: Deploy & Configure Log Aggregation with Grafana Loki & Promtail
  description: Apply the declarative manifest for obs-08-loki-promtail-log-pipeline
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-08-loki-promtail-log-pipeline
    namespace: lab-obs-08-loki-promtail-log-pipeline
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-obs-08-loki-promtail-log-pipeline
  title: Verify Production Hardening & Labels for Log Aggregation with Grafana Loki
    & Promtail
  description: Verify metadata labels and security compliance in namespace lab-obs-08-loki-promtail-log-pipeline.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-08-loki-promtail-log-pipeline
    namespace: lab-obs-08-loki-promtail-log-pipeline
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: obs-08-loki-promtail-log-pipeline
hints:
- text: Inspect the live objects with `kubectl get all -n lab-obs-08-loki-promtail-log-pipeline
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=obs-08-loki-promtail-log-pipeline
    -n lab-obs-08-loki-promtail-log-pipeline`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/observability/obs-08-loki-promtail-log-pipeline/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
