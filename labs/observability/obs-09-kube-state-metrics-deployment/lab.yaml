id: obs-09-kube-state-metrics-deployment
title: Cluster Health Metrics with kube-state-metrics
difficulty: intermediate
duration_minutes: 15
track: observability
scenario: Expose Kubernetes object state metrics (pod restarts, deployment availability,
  quota usage).
objectives:
- Master Cluster Health Metrics with kube-state-metrics architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in obs-09-kube-state-metrics-deployment
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-obs-09-kube-state-metrics-deployment
      labels:
        kubelab.io/track: observability
        kubelab.io/lab: obs-09-kube-state-metrics-deployment
tasks:
- id: task-01-obs-09-kube-state-metrics-deployment
  title: Deploy & Configure Cluster Health Metrics with kube-state-metrics
  description: Apply the declarative manifest for obs-09-kube-state-metrics-deployment
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-09-kube-state-metrics-deployment
    namespace: lab-obs-09-kube-state-metrics-deployment
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-obs-09-kube-state-metrics-deployment
  title: Verify Production Hardening & Labels for Cluster Health Metrics with kube-state-metrics
  description: Verify metadata labels and security compliance in namespace lab-obs-09-kube-state-metrics-deployment.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-09-kube-state-metrics-deployment
    namespace: lab-obs-09-kube-state-metrics-deployment
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: obs-09-kube-state-metrics-deployment
hints:
- text: Inspect the live objects with `kubectl get all -n lab-obs-09-kube-state-metrics-deployment
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=obs-09-kube-state-metrics-deployment
    -n lab-obs-09-kube-state-metrics-deployment`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/observability/obs-09-kube-state-metrics-deployment/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
