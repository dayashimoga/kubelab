id: obs-10-blackbox-exporter-probes
title: Synthetic Endpoint Monitoring with Blackbox Exporter
difficulty: intermediate
duration_minutes: 15
track: observability
scenario: Probe external endpoints over HTTP, TCP, and ICMP to monitor uptime and
  SSL certificate validity.
objectives:
- Master Synthetic Endpoint Monitoring with Blackbox Exporter architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in obs-10-blackbox-exporter-probes
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-obs-10-blackbox-exporter-probes
      labels:
        kubelab.io/track: observability
        kubelab.io/lab: obs-10-blackbox-exporter-probes
tasks:
- id: task-01-obs-10-blackbox-exporter-probes
  title: Deploy & Configure Synthetic Endpoint Monitoring with Blackbox Exporter
  description: Apply the declarative manifest for obs-10-blackbox-exporter-probes
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-10-blackbox-exporter-probes
    namespace: lab-obs-10-blackbox-exporter-probes
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-obs-10-blackbox-exporter-probes
  title: Verify Production Hardening & Labels for Synthetic Endpoint Monitoring with
    Blackbox Exporter
  description: Verify metadata labels and security compliance in namespace lab-obs-10-blackbox-exporter-probes.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: obs-10-blackbox-exporter-probes
    namespace: lab-obs-10-blackbox-exporter-probes
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: obs-10-blackbox-exporter-probes
hints:
- text: Inspect the live objects with `kubectl get all -n lab-obs-10-blackbox-exporter-probes
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=obs-10-blackbox-exporter-probes
    -n lab-obs-10-blackbox-exporter-probes`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/observability/obs-10-blackbox-exporter-probes/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
