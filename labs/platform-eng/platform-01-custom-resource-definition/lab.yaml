id: platform-01-custom-resource-definition
title: Designing Custom Resource Definitions (CRDs)
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Author OpenAPI v3 validated CRDs with status subresources and kubectl printer
  columns.
objectives:
- Master Designing Custom Resource Definitions (CRDs) architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-01-custom-resource-definition
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-01-custom-resource-definition
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-01-custom-resource-definition
tasks:
- id: task-01-platform-01-custom-resource-definition
  title: Deploy & Configure Designing Custom Resource Definitions (CRDs)
  description: Apply the declarative manifest for platform-01-custom-resource-definition
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-01-custom-resource-definition
    namespace: lab-platform-01-custom-resource-definition
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-01-custom-resource-definition
  title: Verify Production Hardening & Labels for Designing Custom Resource Definitions
    (CRDs)
  description: Verify metadata labels and security compliance in namespace lab-platform-01-custom-resource-definition.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-01-custom-resource-definition
    namespace: lab-platform-01-custom-resource-definition
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-01-custom-resource-definition
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-01-custom-resource-definition
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-01-custom-resource-definition
    -n lab-platform-01-custom-resource-definition`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-01-custom-resource-definition/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
