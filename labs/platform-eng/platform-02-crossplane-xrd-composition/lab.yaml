id: platform-02-crossplane-xrd-composition
title: Cloud Infrastructure Composition with Crossplane
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Compose AWS/GCP managed databases and networks into clean declarative Kubernetes
  API abstractions.
objectives:
- Master Cloud Infrastructure Composition with Crossplane architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-02-crossplane-xrd-composition
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-02-crossplane-xrd-composition
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-02-crossplane-xrd-composition
tasks:
- id: task-01-platform-02-crossplane-xrd-composition
  title: Deploy & Configure Cloud Infrastructure Composition with Crossplane
  description: Apply the declarative manifest for platform-02-crossplane-xrd-composition
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-02-crossplane-xrd-composition
    namespace: lab-platform-02-crossplane-xrd-composition
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-02-crossplane-xrd-composition
  title: Verify Production Hardening & Labels for Cloud Infrastructure Composition
    with Crossplane
  description: Verify metadata labels and security compliance in namespace lab-platform-02-crossplane-xrd-composition.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-02-crossplane-xrd-composition
    namespace: lab-platform-02-crossplane-xrd-composition
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-02-crossplane-xrd-composition
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-02-crossplane-xrd-composition
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-02-crossplane-xrd-composition
    -n lab-platform-02-crossplane-xrd-composition`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-02-crossplane-xrd-composition/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
