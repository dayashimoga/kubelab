id: platform-05-backstage-software-template
title: Internal Developer Platforms & Backstage Templates
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Create self-service golden paths for engineering teams using Backstage software
  templates.
objectives:
- Master Internal Developer Platforms & Backstage Templates architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-05-backstage-software-template
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-05-backstage-software-template
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-05-backstage-software-template
tasks:
- id: task-01-platform-05-backstage-software-template
  title: Deploy & Configure Internal Developer Platforms & Backstage Templates
  description: Apply the declarative manifest for platform-05-backstage-software-template
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-05-backstage-software-template
    namespace: lab-platform-05-backstage-software-template
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-05-backstage-software-template
  title: Verify Production Hardening & Labels for Internal Developer Platforms & Backstage
    Templates
  description: Verify metadata labels and security compliance in namespace lab-platform-05-backstage-software-template.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-05-backstage-software-template
    namespace: lab-platform-05-backstage-software-template
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-05-backstage-software-template
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-05-backstage-software-template
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-05-backstage-software-template
    -n lab-platform-05-backstage-software-template`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-05-backstage-software-template/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
