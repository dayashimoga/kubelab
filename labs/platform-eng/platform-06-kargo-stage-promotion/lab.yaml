id: platform-06-kargo-stage-promotion
title: Multi-Stage Artifact Promotion with Kargo
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Automate progressive GitOps stage promotion across development, staging,
  and production.
objectives:
- Master Multi-Stage Artifact Promotion with Kargo architecture and declarative configurations
- Diagnose and remediate common production gotchas in platform-06-kargo-stage-promotion
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-06-kargo-stage-promotion
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-06-kargo-stage-promotion
tasks:
- id: task-01-platform-06-kargo-stage-promotion
  title: Deploy & Configure Multi-Stage Artifact Promotion with Kargo
  description: Apply the declarative manifest for platform-06-kargo-stage-promotion
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-06-kargo-stage-promotion
    namespace: lab-platform-06-kargo-stage-promotion
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-06-kargo-stage-promotion
  title: Verify Production Hardening & Labels for Multi-Stage Artifact Promotion with
    Kargo
  description: Verify metadata labels and security compliance in namespace lab-platform-06-kargo-stage-promotion.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-06-kargo-stage-promotion
    namespace: lab-platform-06-kargo-stage-promotion
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-06-kargo-stage-promotion
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-06-kargo-stage-promotion
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-06-kargo-stage-promotion
    -n lab-platform-06-kargo-stage-promotion`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-06-kargo-stage-promotion/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
