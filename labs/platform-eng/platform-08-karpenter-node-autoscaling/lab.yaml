id: platform-08-karpenter-node-autoscaling
title: Fast Just-in-Time Node Autoscaling with Karpenter
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Bin-pack and provision right-sized cloud instances in seconds based on pending
  pod requirements.
objectives:
- Master Fast Just-in-Time Node Autoscaling with Karpenter architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-08-karpenter-node-autoscaling
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-08-karpenter-node-autoscaling
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-08-karpenter-node-autoscaling
tasks:
- id: task-01-platform-08-karpenter-node-autoscaling
  title: Deploy & Configure Fast Just-in-Time Node Autoscaling with Karpenter
  description: Apply the declarative manifest for platform-08-karpenter-node-autoscaling
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-08-karpenter-node-autoscaling
    namespace: lab-platform-08-karpenter-node-autoscaling
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-08-karpenter-node-autoscaling
  title: Verify Production Hardening & Labels for Fast Just-in-Time Node Autoscaling
    with Karpenter
  description: Verify metadata labels and security compliance in namespace lab-platform-08-karpenter-node-autoscaling.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-08-karpenter-node-autoscaling
    namespace: lab-platform-08-karpenter-node-autoscaling
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-08-karpenter-node-autoscaling
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-08-karpenter-node-autoscaling
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-08-karpenter-node-autoscaling
    -n lab-platform-08-karpenter-node-autoscaling`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-08-karpenter-node-autoscaling/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
