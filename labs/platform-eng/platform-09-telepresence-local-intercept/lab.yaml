id: platform-09-telepresence-local-intercept
title: Rapid Local Development Loops with Telepresence
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Intercept remote cluster microservice traffic and route it to local developer
  workstations.
objectives:
- Master Rapid Local Development Loops with Telepresence architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-09-telepresence-local-intercept
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-09-telepresence-local-intercept
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-09-telepresence-local-intercept
tasks:
- id: task-01-platform-09-telepresence-local-intercept
  title: Deploy & Configure Rapid Local Development Loops with Telepresence
  description: Apply the declarative manifest for platform-09-telepresence-local-intercept
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-09-telepresence-local-intercept
    namespace: lab-platform-09-telepresence-local-intercept
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-09-telepresence-local-intercept
  title: Verify Production Hardening & Labels for Rapid Local Development Loops with
    Telepresence
  description: Verify metadata labels and security compliance in namespace lab-platform-09-telepresence-local-intercept.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-09-telepresence-local-intercept
    namespace: lab-platform-09-telepresence-local-intercept
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-09-telepresence-local-intercept
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-09-telepresence-local-intercept
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-09-telepresence-local-intercept
    -n lab-platform-09-telepresence-local-intercept`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-09-telepresence-local-intercept/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
