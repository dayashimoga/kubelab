id: platform-10-devspace-rapid-inner-loop
title: Hot-Reload Container Workflows with DevSpace
difficulty: advanced
duration_minutes: 15
track: platform-eng
scenario: Sync source code and hot-reload code directly inside running Kubernetes
  pods without rebuilding images.
objectives:
- Master Hot-Reload Container Workflows with DevSpace architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in platform-10-devspace-rapid-inner-loop
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-platform-10-devspace-rapid-inner-loop
      labels:
        kubelab.io/track: platform-eng
        kubelab.io/lab: platform-10-devspace-rapid-inner-loop
tasks:
- id: task-01-platform-10-devspace-rapid-inner-loop
  title: Deploy & Configure Hot-Reload Container Workflows with DevSpace
  description: Apply the declarative manifest for platform-10-devspace-rapid-inner-loop
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-10-devspace-rapid-inner-loop
    namespace: lab-platform-10-devspace-rapid-inner-loop
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-platform-10-devspace-rapid-inner-loop
  title: Verify Production Hardening & Labels for Hot-Reload Container Workflows with
    DevSpace
  description: Verify metadata labels and security compliance in namespace lab-platform-10-devspace-rapid-inner-loop.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: platform-10-devspace-rapid-inner-loop
    namespace: lab-platform-10-devspace-rapid-inner-loop
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: platform-10-devspace-rapid-inner-loop
hints:
- text: Inspect the live objects with `kubectl get all -n lab-platform-10-devspace-rapid-inner-loop
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=platform-10-devspace-rapid-inner-loop
    -n lab-platform-10-devspace-rapid-inner-loop`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/platform-eng/platform-10-devspace-rapid-inner-loop/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
