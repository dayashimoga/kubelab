id: plat-01-custom-resource-definition
title: Designing Production CRDs with OpenAPI v3
difficulty: intermediate
duration_minutes: 20
track: platform-multicluster
objectives:
- Master Designing Production CRDs with OpenAPI v3 in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Define Schema validation and subresources in CRD
tasks:
- id: task-verify-plat-01-custom-resource-definition
  title: Verify Designing Production CRDs with OpenAPI v3
  description: Verify metadata.name on customresourcedefinitions 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: customresourcedefinitions
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `customresourcedefinitions` resource specifications.
  penalty_points: 10
solution: kubectl apply -f plat-01-custom-resource-definition.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
