id: plat-07-kyverno-policy-reporter
title: Centralized Policy Violation Auditing
difficulty: intermediate
duration_minutes: 20
track: platform-multicluster
objectives:
- Master Centralized Policy Violation Auditing in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Aggregate cluster-wide policy reports into UI dashboard
tasks:
- id: task-verify-plat-07-kyverno-policy-reporter
  title: Verify Centralized Policy Violation Auditing
  description: Verify metadata.name on policyreports 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: policyreports
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `policyreports` resource specifications.
  penalty_points: 10
solution: kubectl apply -f plat-07-kyverno-policy-reporter.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
