id: sec-01-rbac-role-binding
title: Role & RoleBinding for Least-Privilege
difficulty: intermediate
duration_minutes: 20
track: security
objectives:
- Master Role & RoleBinding for Least-Privilege in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Grant read-only pod access to developer role
tasks:
- id: task-verify-sec-01-rbac-role-binding
  title: Verify Role & RoleBinding for Least-Privilege
  description: Verify metadata.name on roles 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: roles
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `roles` resource specifications.
  penalty_points: 10
solution: kubectl apply -f sec-01-rbac-role-binding.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
