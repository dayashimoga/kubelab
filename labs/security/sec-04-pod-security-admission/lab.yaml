id: sec-04-pod-security-admission
title: Pod Security Standards (Privileged, Baseline, Restricted)
difficulty: intermediate
duration_minutes: 15
track: security
scenario: 'Enforce cluster-wide Pod Security Standards labels: enforce, audit, and
  warn at Restricted levels.'
objectives:
- Master Pod Security Standards (Privileged, Baseline, Restricted) architecture and
  declarative configurations
- Diagnose and remediate common production gotchas in sec-04-pod-security-admission
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sec-04-pod-security-admission
      labels:
        kubelab.io/track: security
        kubelab.io/lab: sec-04-pod-security-admission
tasks:
- id: task-01-sec-04-pod-security-admission
  title: Deploy & Configure Pod Security Standards (Privileged, Baseline, Restricted)
  description: Apply the declarative manifest for sec-04-pod-security-admission and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-04-pod-security-admission
    namespace: lab-sec-04-pod-security-admission
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-sec-04-pod-security-admission
  title: Verify Production Hardening & Labels for Pod Security Standards (Privileged,
    Baseline, Restricted)
  description: Verify metadata labels and security compliance in namespace lab-sec-04-pod-security-admission.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-04-pod-security-admission
    namespace: lab-sec-04-pod-security-admission
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sec-04-pod-security-admission
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sec-04-pod-security-admission
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sec-04-pod-security-admission
    -n lab-sec-04-pod-security-admission`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/security/sec-04-pod-security-admission/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
