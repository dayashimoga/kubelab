id: sec-06-apparmor-profiles
title: AppArmor Profiles for Filesystem Protection
difficulty: intermediate
duration_minutes: 20
track: security
objectives:
- Master AppArmor Profiles for Filesystem Protection in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Load and enforce read-only AppArmor container profile
tasks:
- id: task-verify-sec-06-apparmor-profiles
  title: Verify AppArmor Profiles for Filesystem Protection
  description: Verify metadata.name on pods 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: pods
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `pods` resource specifications.
  penalty_points: 10
solution: kubectl apply -f sec-06-apparmor-profiles.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
