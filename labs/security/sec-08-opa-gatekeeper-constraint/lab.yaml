id: sec-08-opa-gatekeeper-constraint
title: Policy-as-Code with OPA Gatekeeper & Rego
difficulty: intermediate
duration_minutes: 15
track: security
scenario: Define declarative admission guardrails using ConstraintTemplates and Rego
  validation rules.
objectives:
- Master Policy-as-Code with OPA Gatekeeper & Rego architecture and declarative configurations
- Diagnose and remediate common production gotchas in sec-08-opa-gatekeeper-constraint
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sec-08-opa-gatekeeper-constraint
      labels:
        kubelab.io/track: security
        kubelab.io/lab: sec-08-opa-gatekeeper-constraint
tasks:
- id: task-01-sec-08-opa-gatekeeper-constraint
  title: Deploy & Configure Policy-as-Code with OPA Gatekeeper & Rego
  description: Apply the declarative manifest for sec-08-opa-gatekeeper-constraint
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-08-opa-gatekeeper-constraint
    namespace: lab-sec-08-opa-gatekeeper-constraint
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-sec-08-opa-gatekeeper-constraint
  title: Verify Production Hardening & Labels for Policy-as-Code with OPA Gatekeeper
    & Rego
  description: Verify metadata labels and security compliance in namespace lab-sec-08-opa-gatekeeper-constraint.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-08-opa-gatekeeper-constraint
    namespace: lab-sec-08-opa-gatekeeper-constraint
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sec-08-opa-gatekeeper-constraint
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sec-08-opa-gatekeeper-constraint
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sec-08-opa-gatekeeper-constraint
    -n lab-sec-08-opa-gatekeeper-constraint`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/security/sec-08-opa-gatekeeper-constraint/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
