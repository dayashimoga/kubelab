id: sec-10-falco-runtime-security
title: Runtime Threat Detection with Falco & eBPF
difficulty: intermediate
duration_minutes: 15
track: security
scenario: Detect container breakouts, terminal spawning, and privilege escalation
  using Falco kernel audit rules.
objectives:
- Master Runtime Threat Detection with Falco & eBPF architecture and declarative configurations
- Diagnose and remediate common production gotchas in sec-10-falco-runtime-security
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sec-10-falco-runtime-security
      labels:
        kubelab.io/track: security
        kubelab.io/lab: sec-10-falco-runtime-security
tasks:
- id: task-01-sec-10-falco-runtime-security
  title: Deploy & Configure Runtime Threat Detection with Falco & eBPF
  description: Apply the declarative manifest for sec-10-falco-runtime-security and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-10-falco-runtime-security
    namespace: lab-sec-10-falco-runtime-security
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-sec-10-falco-runtime-security
  title: Verify Production Hardening & Labels for Runtime Threat Detection with Falco
    & eBPF
  description: Verify metadata labels and security compliance in namespace lab-sec-10-falco-runtime-security.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-10-falco-runtime-security
    namespace: lab-sec-10-falco-runtime-security
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sec-10-falco-runtime-security
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sec-10-falco-runtime-security
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sec-10-falco-runtime-security
    -n lab-sec-10-falco-runtime-security`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/security/sec-10-falco-runtime-security/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
