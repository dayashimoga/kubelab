id: sec-12-cosign-image-signing
title: Cryptographic Image Signing & Verification with Cosign
difficulty: intermediate
duration_minutes: 15
track: security
scenario: Sign container images with Sigstore Cosign and enforce signature validation
  in admission webhooks.
objectives:
- Master Cryptographic Image Signing & Verification with Cosign architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in sec-12-cosign-image-signing
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sec-12-cosign-image-signing
      labels:
        kubelab.io/track: security
        kubelab.io/lab: sec-12-cosign-image-signing
tasks:
- id: task-01-sec-12-cosign-image-signing
  title: Deploy & Configure Cryptographic Image Signing & Verification with Cosign
  description: Apply the declarative manifest for sec-12-cosign-image-signing and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-12-cosign-image-signing
    namespace: lab-sec-12-cosign-image-signing
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-sec-12-cosign-image-signing
  title: Verify Production Hardening & Labels for Cryptographic Image Signing & Verification
    with Cosign
  description: Verify metadata labels and security compliance in namespace lab-sec-12-cosign-image-signing.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sec-12-cosign-image-signing
    namespace: lab-sec-12-cosign-image-signing
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sec-12-cosign-image-signing
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sec-12-cosign-image-signing
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sec-12-cosign-image-signing
    -n lab-sec-12-cosign-image-signing`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/security/sec-12-cosign-image-signing/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
