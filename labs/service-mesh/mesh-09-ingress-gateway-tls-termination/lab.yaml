id: mesh-09-ingress-gateway-tls-termination
title: Istio Ingress Gateway & TLS Termination
difficulty: intermediate
duration_minutes: 15
track: service-mesh
scenario: Expose mesh services to external clients through Istio Gateway with SNI
  and TLS certificates.
objectives:
- Master Istio Ingress Gateway & TLS Termination architecture and declarative configurations
- Diagnose and remediate common production gotchas in mesh-09-ingress-gateway-tls-termination
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-mesh-09-ingress-gateway-tls-termination
      labels:
        kubelab.io/track: service-mesh
        kubelab.io/lab: mesh-09-ingress-gateway-tls-termination
tasks:
- id: task-01-mesh-09-ingress-gateway-tls-termination
  title: Deploy & Configure Istio Ingress Gateway & TLS Termination
  description: Apply the declarative manifest for mesh-09-ingress-gateway-tls-termination
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: mesh-09-ingress-gateway-tls-termination
    namespace: lab-mesh-09-ingress-gateway-tls-termination
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-mesh-09-ingress-gateway-tls-termination
  title: Verify Production Hardening & Labels for Istio Ingress Gateway & TLS Termination
  description: Verify metadata labels and security compliance in namespace lab-mesh-09-ingress-gateway-tls-termination.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: mesh-09-ingress-gateway-tls-termination
    namespace: lab-mesh-09-ingress-gateway-tls-termination
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: mesh-09-ingress-gateway-tls-termination
hints:
- text: Inspect the live objects with `kubectl get all -n lab-mesh-09-ingress-gateway-tls-termination
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=mesh-09-ingress-gateway-tls-termination
    -n lab-mesh-09-ingress-gateway-tls-termination`
