  points: 100
  validation:
    type: k8s_resource
    resource: envoyfilters
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `envoyfilters` resource specifications.
  penalty_points: 10
solution: kubectl apply -f mesh-09-rate-limiting-envoyfilter.yaml
cleanup:
  auto: true
