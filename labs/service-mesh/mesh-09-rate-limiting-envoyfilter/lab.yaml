id: mesh-09-rate-limiting-envoyfilter
title: Global Rate Limiting with EnvoyFilter
difficulty: intermediate
duration_minutes: 20
track: service-mesh
objectives:
- Master Global Rate Limiting with EnvoyFilter in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Enforce 100 req/min rate limits via EnvoyFilter config
tasks:
- id: task-verify-mesh-09-rate-limiting-envoyfilter
  title: Verify Global Rate Limiting with EnvoyFilter
