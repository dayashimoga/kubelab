id: mesh-11-envoyfilter-lua-scripting
title: EnvoyFilter Custom Lua Scripting & Wasm Plugins
difficulty: intermediate
duration_minutes: 15
track: service-mesh
scenario: Inject custom Lua scripts and WebAssembly filters into Envoy proxy request
  pipelines.
objectives:
- Master EnvoyFilter Custom Lua Scripting & Wasm Plugins architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in mesh-11-envoyfilter-lua-scripting
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-mesh-11-envoyfilter-lua-scripting
      labels:
        kubelab.io/track: service-mesh
        kubelab.io/lab: mesh-11-envoyfilter-lua-scripting
tasks:
- id: task-01-mesh-11-envoyfilter-lua-scripting
  title: Deploy & Configure EnvoyFilter Custom Lua Scripting & Wasm Plugins
  description: Apply the declarative manifest for mesh-11-envoyfilter-lua-scripting
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: mesh-11-envoyfilter-lua-scripting
    namespace: lab-mesh-11-envoyfilter-lua-scripting
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-mesh-11-envoyfilter-lua-scripting
  title: Verify Production Hardening & Labels for EnvoyFilter Custom Lua Scripting
    & Wasm Plugins
  description: Verify metadata labels and security compliance in namespace lab-mesh-11-envoyfilter-lua-scripting.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: mesh-11-envoyfilter-lua-scripting
    namespace: lab-mesh-11-envoyfilter-lua-scripting
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: mesh-11-envoyfilter-lua-scripting
hints:
- text: Inspect the live objects with `kubectl get all -n lab-mesh-11-envoyfilter-lua-scripting
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=mesh-11-envoyfilter-lua-scripting
    -n lab-mesh-11-envoyfilter-lua-scripting`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/service-mesh/mesh-11-envoyfilter-lua-scripting/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
