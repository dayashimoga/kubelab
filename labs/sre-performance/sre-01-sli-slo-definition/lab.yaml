id: sre-01-sli-slo-definition
title: Defining Service Level Indicators (SLIs) & Objectives (SLOs)
difficulty: advanced
duration_minutes: 15
track: sre-performance
scenario: Formulate quantitative availability and latency SLIs using Prometheus PromQL
  expressions.
objectives:
- Master Defining Service Level Indicators (SLIs) & Objectives (SLOs) architecture
  and declarative configurations
- Diagnose and remediate common production gotchas in sre-01-sli-slo-definition
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sre-01-sli-slo-definition
      labels:
        kubelab.io/track: sre-performance
        kubelab.io/lab: sre-01-sli-slo-definition
tasks:
- id: task-01-sre-01-sli-slo-definition
  title: Deploy & Configure Defining Service Level Indicators (SLIs) & Objectives
    (SLOs)
  description: Apply the declarative manifest for sre-01-sli-slo-definition and ensure
    resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-01-sli-slo-definition
    namespace: lab-sre-01-sli-slo-definition
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-sre-01-sli-slo-definition
  title: Verify Production Hardening & Labels for Defining Service Level Indicators
    (SLIs) & Objectives (SLOs)
  description: Verify metadata labels and security compliance in namespace lab-sre-01-sli-slo-definition.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-01-sli-slo-definition
    namespace: lab-sre-01-sli-slo-definition
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sre-01-sli-slo-definition
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sre-01-sli-slo-definition
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sre-01-sli-slo-definition
    -n lab-sre-01-sli-slo-definition`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/sre-performance/sre-01-sli-slo-definition/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
