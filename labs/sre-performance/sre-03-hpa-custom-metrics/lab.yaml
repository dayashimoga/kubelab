id: sre-03-hpa-custom-metrics
title: Autoscaling on Custom Prometheus Metrics
difficulty: intermediate
duration_minutes: 20
track: sre-performance
objectives:
- Master Autoscaling on Custom Prometheus Metrics in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Scale pods based on active HTTP request rate per second
tasks:
- id: task-verify-sre-03-hpa-custom-metrics
  title: Verify Autoscaling on Custom Prometheus Metrics
  description: Verify metadata.name on horizontalpodautoscalers 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: horizontalpodautoscalers
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `horizontalpodautoscalers` resource specifications.
  penalty_points: 10
solution: kubectl apply -f sre-03-hpa-custom-metrics.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
