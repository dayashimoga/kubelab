id: sre-04-vpa-resource-recommender
title: Vertical Pod Autoscaler Resource Recommendations
difficulty: intermediate
duration_minutes: 20
track: sre-performance
objectives:
- Master Vertical Pod Autoscaler Resource Recommendations in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Auto-adjust CPU/RAM limits based on historical usage
tasks:
- id: task-verify-sre-04-vpa-resource-recommender
  title: Verify Vertical Pod Autoscaler Resource Recommendations
  description: Verify metadata.name on verticalpodautoscalers 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: verticalpodautoscalers
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `verticalpodautoscalers` resource specifications.
  penalty_points: 10
solution: kubectl apply -f sre-04-vpa-resource-recommender.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
