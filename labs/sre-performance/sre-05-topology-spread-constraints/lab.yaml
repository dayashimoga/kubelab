id: sre-05-topology-spread-constraints
title: Multi-Zone High Availability with TopologySpreadConstraints
difficulty: advanced
duration_minutes: 15
track: sre-performance
scenario: Distribute pod replicas evenly across availability zones using maxSkew and
  topologyKey.
objectives:
- Master Multi-Zone High Availability with TopologySpreadConstraints architecture
  and declarative configurations
- Diagnose and remediate common production gotchas in sre-05-topology-spread-constraints
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sre-05-topology-spread-constraints
      labels:
        kubelab.io/track: sre-performance
        kubelab.io/lab: sre-05-topology-spread-constraints
tasks:
- id: task-01-sre-05-topology-spread-constraints
  title: Deploy & Configure Multi-Zone High Availability with TopologySpreadConstraints
  description: Apply the declarative manifest for sre-05-topology-spread-constraints
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-05-topology-spread-constraints
    namespace: lab-sre-05-topology-spread-constraints
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-sre-05-topology-spread-constraints
  title: Verify Production Hardening & Labels for Multi-Zone High Availability with
    TopologySpreadConstraints
  description: Verify metadata labels and security compliance in namespace lab-sre-05-topology-spread-constraints.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-05-topology-spread-constraints
    namespace: lab-sre-05-topology-spread-constraints
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sre-05-topology-spread-constraints
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sre-05-topology-spread-constraints
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sre-05-topology-spread-constraints
    -n lab-sre-05-topology-spread-constraints`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/sre-performance/sre-05-topology-spread-constraints/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
