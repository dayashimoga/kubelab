id: sre-06-pod-priority-preemption
title: Pod PriorityClasses & Preemption Architecture
difficulty: advanced
duration_minutes: 15
track: sre-performance
scenario: Protect critical workloads and allow graceful preemption of low-priority
  batch jobs.
objectives:
- Master Pod PriorityClasses & Preemption Architecture architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in sre-06-pod-priority-preemption
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sre-06-pod-priority-preemption
      labels:
        kubelab.io/track: sre-performance
        kubelab.io/lab: sre-06-pod-priority-preemption
tasks:
- id: task-01-sre-06-pod-priority-preemption
  title: Deploy & Configure Pod PriorityClasses & Preemption Architecture
  description: Apply the declarative manifest for sre-06-pod-priority-preemption and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sre-06-pod-priority-preemption
    namespace: lab-sre-06-pod-priority-preemption
    assertions:
    - field: status.phase
      operator: equals
      expected: Running
- id: task-02-sre-06-pod-priority-preemption
  title: Verify Production Hardening & Labels for Pod PriorityClasses & Preemption
    Architecture
  description: Verify metadata labels and security compliance in namespace lab-sre-06-pod-priority-preemption.
  points: 50
  validation:
    type: k8s_resource
    resource: pods
    name: sre-06-pod-priority-preemption
    namespace: lab-sre-06-pod-priority-preemption
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sre-06-pod-priority-preemption
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sre-06-pod-priority-preemption
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sre-06-pod-priority-preemption
    -n lab-sre-06-pod-priority-preemption`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/sre-performance/sre-06-pod-priority-preemption/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
