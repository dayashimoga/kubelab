id: sre-07-node-problem-detector
title: Node Problem Detector & Automated Node Remediation
difficulty: advanced
duration_minutes: 15
track: sre-performance
scenario: Detect kernel deadlocks, corrupted filesystems, and automate cordoning before
  failures spread.
objectives:
- Master Node Problem Detector & Automated Node Remediation architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in sre-07-node-problem-detector
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sre-07-node-problem-detector
      labels:
        kubelab.io/track: sre-performance
        kubelab.io/lab: sre-07-node-problem-detector
tasks:
- id: task-01-sre-07-node-problem-detector
  title: Deploy & Configure Node Problem Detector & Automated Node Remediation
  description: Apply the declarative manifest for sre-07-node-problem-detector and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-07-node-problem-detector
    namespace: lab-sre-07-node-problem-detector
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-sre-07-node-problem-detector
  title: Verify Production Hardening & Labels for Node Problem Detector & Automated
    Node Remediation
  description: Verify metadata labels and security compliance in namespace lab-sre-07-node-problem-detector.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-07-node-problem-detector
    namespace: lab-sre-07-node-problem-detector
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sre-07-node-problem-detector
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sre-07-node-problem-detector
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sre-07-node-problem-detector
    -n lab-sre-07-node-problem-detector`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/sre-performance/sre-07-node-problem-detector/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
