id: sre-10-kubelet-eviction-thresholds
title: Kubelet Eviction Thresholds & Node OOM Management
difficulty: advanced
duration_minutes: 15
track: sre-performance
scenario: Configure hard and soft eviction thresholds to prevent catastrophic node
  kernel panics.
objectives:
- Master Kubelet Eviction Thresholds & Node OOM Management architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in sre-10-kubelet-eviction-thresholds
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-sre-10-kubelet-eviction-thresholds
      labels:
        kubelab.io/track: sre-performance
        kubelab.io/lab: sre-10-kubelet-eviction-thresholds
tasks:
- id: task-01-sre-10-kubelet-eviction-thresholds
  title: Deploy & Configure Kubelet Eviction Thresholds & Node OOM Management
  description: Apply the declarative manifest for sre-10-kubelet-eviction-thresholds
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-10-kubelet-eviction-thresholds
    namespace: lab-sre-10-kubelet-eviction-thresholds
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-sre-10-kubelet-eviction-thresholds
  title: Verify Production Hardening & Labels for Kubelet Eviction Thresholds & Node
    OOM Management
  description: Verify metadata labels and security compliance in namespace lab-sre-10-kubelet-eviction-thresholds.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: sre-10-kubelet-eviction-thresholds
    namespace: lab-sre-10-kubelet-eviction-thresholds
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: sre-10-kubelet-eviction-thresholds
hints:
- text: Inspect the live objects with `kubectl get all -n lab-sre-10-kubelet-eviction-thresholds
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=sre-10-kubelet-eviction-thresholds
    -n lab-sre-10-kubelet-eviction-thresholds`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/sre-performance/sre-10-kubelet-eviction-thresholds/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
