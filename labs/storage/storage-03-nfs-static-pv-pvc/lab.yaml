id: storage-03-nfs-static-pv-pvc
title: Static PersistentVolume & PersistentVolumeClaim Binding
difficulty: advanced
duration_minutes: 15
track: storage
scenario: Bind static PVs and PVCs with accessModes ReadWriteMany and ReadWriteOnce.
objectives:
- Master Static PersistentVolume & PersistentVolumeClaim Binding architecture and
  declarative configurations
- Diagnose and remediate common production gotchas in storage-03-nfs-static-pv-pvc
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-storage-03-nfs-static-pv-pvc
      labels:
        kubelab.io/track: storage
        kubelab.io/lab: storage-03-nfs-static-pv-pvc
tasks:
- id: task-01-storage-03-nfs-static-pv-pvc
  title: Deploy & Configure Static PersistentVolume & PersistentVolumeClaim Binding
  description: Apply the declarative manifest for storage-03-nfs-static-pv-pvc and
    ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-03-nfs-static-pv-pvc
    namespace: lab-storage-03-nfs-static-pv-pvc
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-storage-03-nfs-static-pv-pvc
  title: Verify Production Hardening & Labels for Static PersistentVolume & PersistentVolumeClaim
    Binding
  description: Verify metadata labels and security compliance in namespace lab-storage-03-nfs-static-pv-pvc.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-03-nfs-static-pv-pvc
    namespace: lab-storage-03-nfs-static-pv-pvc
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: storage-03-nfs-static-pv-pvc
hints:
- text: Inspect the live objects with `kubectl get all -n lab-storage-03-nfs-static-pv-pvc
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=storage-03-nfs-static-pv-pvc
    -n lab-storage-03-nfs-static-pv-pvc`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/storage/storage-03-nfs-static-pv-pvc/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
