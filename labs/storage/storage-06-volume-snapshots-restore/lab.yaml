id: storage-06-volume-snapshots-restore
title: CSI VolumeSnapshots & Point-in-Time Restoration
difficulty: advanced
duration_minutes: 15
track: storage
scenario: Take point-in-time CSI volume snapshots and restore them into new PersistentVolumeClaims.
objectives:
- Master CSI VolumeSnapshots & Point-in-Time Restoration architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in storage-06-volume-snapshots-restore
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-storage-06-volume-snapshots-restore
      labels:
        kubelab.io/track: storage
        kubelab.io/lab: storage-06-volume-snapshots-restore
tasks:
- id: task-01-storage-06-volume-snapshots-restore
  title: Deploy & Configure CSI VolumeSnapshots & Point-in-Time Restoration
  description: Apply the declarative manifest for storage-06-volume-snapshots-restore
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-06-volume-snapshots-restore
    namespace: lab-storage-06-volume-snapshots-restore
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-storage-06-volume-snapshots-restore
  title: Verify Production Hardening & Labels for CSI VolumeSnapshots & Point-in-Time
    Restoration
  description: Verify metadata labels and security compliance in namespace lab-storage-06-volume-snapshots-restore.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-06-volume-snapshots-restore
    namespace: lab-storage-06-volume-snapshots-restore
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: storage-06-volume-snapshots-restore
hints:
- text: Inspect the live objects with `kubectl get all -n lab-storage-06-volume-snapshots-restore
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=storage-06-volume-snapshots-restore
    -n lab-storage-06-volume-snapshots-restore`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/storage/storage-06-volume-snapshots-restore/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
