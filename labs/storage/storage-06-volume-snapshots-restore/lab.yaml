  points: 100
  validation:
    type: k8s_resource
    resource: volumesnapshots
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `volumesnapshots` resource specifications.
  penalty_points: 10
solution: kubectl apply -f storage-06-volume-snapshots-restore.yaml
cleanup:
