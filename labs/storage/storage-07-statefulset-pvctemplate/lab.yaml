id: storage-07-statefulset-pvctemplate
title: StatefulSet volumeClaimTemplates & Storage Binding
difficulty: advanced
duration_minutes: 15
track: storage
scenario: Dynamically allocate independent persistent volumes per StatefulSet replica.
objectives:
- Master StatefulSet volumeClaimTemplates & Storage Binding architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in storage-07-statefulset-pvctemplate
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-storage-07-statefulset-pvctemplate
      labels:
        kubelab.io/track: storage
        kubelab.io/lab: storage-07-statefulset-pvctemplate
tasks:
- id: task-01-storage-07-statefulset-pvctemplate
  title: Deploy & Configure StatefulSet volumeClaimTemplates & Storage Binding
  description: Apply the declarative manifest for storage-07-statefulset-pvctemplate
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-07-statefulset-pvctemplate
    namespace: lab-storage-07-statefulset-pvctemplate
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-storage-07-statefulset-pvctemplate
  title: Verify Production Hardening & Labels for StatefulSet volumeClaimTemplates
    & Storage Binding
  description: Verify metadata labels and security compliance in namespace lab-storage-07-statefulset-pvctemplate.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: storage-07-statefulset-pvctemplate
    namespace: lab-storage-07-statefulset-pvctemplate
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: storage-07-statefulset-pvctemplate
hints:
- text: Inspect the live objects with `kubectl get all -n lab-storage-07-statefulset-pvctemplate
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=storage-07-statefulset-pvctemplate
    -n lab-storage-07-statefulset-pvctemplate`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/storage/storage-07-statefulset-pvctemplate/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
