id: tb-10-node-notready-investigation
title: Rescuing NotReady Worker Nodes
difficulty: intermediate
duration_minutes: 20
track: troubleshooting
objectives:
- Master Rescuing NotReady Worker Nodes in Kubernetes
- Execute and verify deterministic live cluster state
prerequisites: []
environment:
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
  type: kubernetes
initial_state:
  manifests: []
scenario: Clear container runtime disk pressure and restart kubelet
tasks:
- id: task-verify-tb-10-node-notready-investigation
  title: Verify Rescuing NotReady Worker Nodes
  description: Verify metadata.name on nodes 'target-resource'
  points: 100
  validation:
    type: k8s_resource
    resource: nodes
    name: target-resource
    namespace: null
    assertions:
    - field: metadata.name
      operator: equals
      expected: target-resource
      actual: null
      passed: null
      error_message: null
hints:
- text: Inspect Kubernetes documentation for `nodes` resource specifications.
  penalty_points: 10
solution: kubectl apply -f tb-10-node-notready-investigation.yaml
cleanup:
  auto: true
limits:
