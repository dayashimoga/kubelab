id: trouble-02-imagepullbackoff-auth
title: Resolving ImagePullBackOff & Registry Authentication
difficulty: advanced
duration_minutes: 15
track: troubleshooting
scenario: Diagnose private registry 401 Unauthorized errors and attach imagePullSecrets.
objectives:
- Master Resolving ImagePullBackOff & Registry Authentication architecture and declarative
