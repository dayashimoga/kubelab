id: trouble-03-pending-insufficient-cpu
title: Debugging Unschedulable Pods (Insufficient CPU/Memory)
difficulty: advanced
duration_minutes: 15
track: troubleshooting
scenario: Identify node resource exhaustion, taints/tolerations mismatches, and scale
  cluster capacity.
objectives:
- Master Debugging Unschedulable Pods (Insufficient CPU/Memory) architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in trouble-03-pending-insufficient-cpu
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-trouble-03-pending-insufficient-cpu
      labels:
        kubelab.io/track: troubleshooting
        kubelab.io/lab: trouble-03-pending-insufficient-cpu
tasks:
- id: task-01-trouble-03-pending-insufficient-cpu
  title: Deploy & Configure Debugging Unschedulable Pods (Insufficient CPU/Memory)
  description: Apply the declarative manifest for trouble-03-pending-insufficient-cpu
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: trouble-03-pending-insufficient-cpu
    namespace: lab-trouble-03-pending-insufficient-cpu
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-trouble-03-pending-insufficient-cpu
  title: Verify Production Hardening & Labels for Debugging Unschedulable Pods (Insufficient
    CPU/Memory)
  description: Verify metadata labels and security compliance in namespace lab-trouble-03-pending-insufficient-cpu.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: trouble-03-pending-insufficient-cpu
    namespace: lab-trouble-03-pending-insufficient-cpu
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: trouble-03-pending-insufficient-cpu
hints:
- text: Inspect the live objects with `kubectl get all -n lab-trouble-03-pending-insufficient-cpu
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=trouble-03-pending-insufficient-cpu
    -n lab-trouble-03-pending-insufficient-cpu`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/troubleshooting/trouble-03-pending-insufficient-cpu/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
