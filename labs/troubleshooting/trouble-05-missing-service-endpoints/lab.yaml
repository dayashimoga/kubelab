id: trouble-05-missing-service-endpoints
title: Fixing Missing Service Endpoints & Label Mismatches
difficulty: advanced
duration_minutes: 15
track: troubleshooting
scenario: Repair broken traffic routing caused by selector/label mismatches between
  Services and Pods.
objectives:
- Master Fixing Missing Service Endpoints & Label Mismatches architecture and declarative
  configurations
- Diagnose and remediate common production gotchas in trouble-05-missing-service-endpoints
- Verify live Kubernetes cluster state deterministically
prerequisites: []
environment:
  type: kubernetes
  cluster: disposable
  namespace_isolation: true
  resources:
    cpu_limit: 500m
    memory_limit: 512Mi
initial_state:
  manifests:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: lab-trouble-05-missing-service-endpoints
      labels:
        kubelab.io/track: troubleshooting
        kubelab.io/lab: trouble-05-missing-service-endpoints
tasks:
- id: task-01-trouble-05-missing-service-endpoints
  title: Deploy & Configure Fixing Missing Service Endpoints & Label Mismatches
  description: Apply the declarative manifest for trouble-05-missing-service-endpoints
    and ensure resource convergence.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: trouble-05-missing-service-endpoints
    namespace: lab-trouble-05-missing-service-endpoints
    assertions:
    - field: status.readyReplicas
      operator: greater_than_or_equal
      expected: 1
- id: task-02-trouble-05-missing-service-endpoints
  title: Verify Production Hardening & Labels for Fixing Missing Service Endpoints
    & Label Mismatches
  description: Verify metadata labels and security compliance in namespace lab-trouble-05-missing-service-endpoints.
  points: 50
  validation:
    type: k8s_resource
    resource: deployments
    name: trouble-05-missing-service-endpoints
    namespace: lab-trouble-05-missing-service-endpoints
    assertions:
    - field: metadata.labels.app
      operator: equals
      expected: trouble-05-missing-service-endpoints
hints:
- text: Inspect the live objects with `kubectl get all -n lab-trouble-05-missing-service-endpoints
    -o wide`
  penalty_points: 10
- text: Review detailed error events using `kubectl describe pods -l app=trouble-05-missing-service-endpoints
    -n lab-trouble-05-missing-service-endpoints`
  penalty_points: 20
solution: kubectl apply -f https://raw.githubusercontent.com/dayashimoga/kubelab/main/labs/troubleshooting/trouble-05-missing-service-endpoints/solution.yaml
cleanup:
  auto: true
limits:
  max_attempts: 5
  timeout_minutes: 25
security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
resources:
  cpu: 250m
  memory: 256Mi
tested_versions:
- v1.28.0
- v1.29.0
- v1.30.0
